# =============================================================================
# mos6502.toml - the NMOS 6502 opcode table
# =============================================================================
#
# REFERENCE DATA, NOT PART OF FRUCTUS.  Nothing in the toolchain assembles or
# simulates this; it exists so tools/gen-6502-map.js can draw the same kind of
# map for the machine Fructus is answering, and so the two can be compared.
#
# THE NMOS PART, ALL OF IT.  The 151 documented opcodes and the 105 the chip
# also does - SLO, LAX, the twenty-seven extra NOPs, the twelve that hang it.
# Those are not free slots: an NMOS 6502 decodes every one of the 256 and does
# something, so a map that showed them blank would be describing a machine that
# does not exist.  They are marked with a leading `*` and drawn apart.
#
# NO 65C02.  BRA, PHX, STZ, the bit instructions and the rest are a later part
# and would fill in exactly the cells this map exists to show empty.
#
# ----------------------------------------------------------------------------
# FORMAT
# ----------------------------------------------------------------------------
# One entry per opcode, in order, eight per line - the same eight columns the
# map draws, so a line here is a row there.
#
#       "MNEMONIC mode cycles"          documented
#       "*MNEMONIC mode cycles"         undocumented
#
# The cycle count is what the instruction takes when nothing goes over a page
# boundary, with a suffix for what can be added:
#
#       4       always four
#       4+      +1 if the indexed address crosses a page
#       2++     a branch: +1 if taken, +2 if taken across a page
#       -       KIL, which stops the processor until reset
#
# The mode names are the ones in [mode] below, which also gives the length -
# that is where the byte counts on the map come from, and tools/gen-6502-map.js
# asserts no entry disagrees with its mode.
# =============================================================================

[cpu]
name       = "MOS 6502"
variant    = "NMOS"
word_bits  = 8
addr_bits  = 16
endian     = "little"
# THE PROPERTY THIS MAP IS DRAWN TO SHOW.  Every 6502 instruction's length is
# fixed by its opcode byte, exactly as in Fructus - one 256-entry table and no
# lookahead.  It is not a modern idea, and this is where Fructus got it.
length_from_first_byte = true

# --- the addressing modes ----------------------------------------------------
# `bytes` includes the opcode.  `write` is what the programmer writes after the
# mnemonic, and it is the operand shape the map prints on each cell.
[mode]
impl = { bytes = 1, write = "",          label = "Implied",          family = "none" }
acc  = { bytes = 1, write = "A",         label = "Accumulator",      family = "none" }
imm  = { bytes = 2, write = "#$nn",      label = "Immediate",        family = "imm"  }
zp   = { bytes = 2, write = "$nn",       label = "Zero page",        family = "zp"   }
zpx  = { bytes = 2, write = "$nn,X",     label = "Zero page,X",      family = "zp"   }
zpy  = { bytes = 2, write = "$nn,Y",     label = "Zero page,Y",      family = "zp"   }
abs  = { bytes = 3, write = "$nnnn",     label = "Absolute",         family = "abs"  }
abx  = { bytes = 3, write = "$nnnn,X",   label = "Absolute,X",       family = "abs"  }
aby  = { bytes = 3, write = "$nnnn,Y",   label = "Absolute,Y",       family = "abs"  }
ind  = { bytes = 3, write = "($nnnn)",   label = "Indirect",         family = "ind"  }
izx  = { bytes = 2, write = "($nn,X)",   label = "Indexed indirect", family = "ind"  }
izy  = { bytes = 2, write = "($nn),Y",   label = "Indirect indexed", family = "ind"  }
rel  = { bytes = 2, write = "label",     label = "Relative",         family = "rel"  }

# --- the 256 -----------------------------------------------------------------
# Its own table, because in TOML everything after a [header] belongs to it and
# this array must not land inside [mode].
[table]
#        .0             .1              .2             .3              .4             .5             .6             .7
ops = [
  "BRK impl 7",   "ORA izx 6",    "*KIL impl -",  "*SLO izx 8",   "*NOP zp 3",   "ORA zp 3",    "ASL zp 5",    "*SLO zp 5",
  "PHP impl 3",   "ORA imm 2",    "ASL acc 2",    "*ANC imm 2",   "*NOP abs 4",  "ORA abs 4",   "ASL abs 6",   "*SLO abs 6",
  "BPL rel 2++",  "ORA izy 5+",   "*KIL impl -",  "*SLO izy 8",   "*NOP zpx 4",  "ORA zpx 4",   "ASL zpx 6",   "*SLO zpx 6",
  "CLC impl 2",   "ORA aby 4+",   "*NOP impl 2",  "*SLO aby 7",   "*NOP abx 4+", "ORA abx 4+",  "ASL abx 7",   "*SLO abx 7",
  "JSR abs 6",    "AND izx 6",    "*KIL impl -",  "*RLA izx 8",   "BIT zp 3",    "AND zp 3",    "ROL zp 5",    "*RLA zp 5",
  "PLP impl 4",   "AND imm 2",    "ROL acc 2",    "*ANC imm 2",   "BIT abs 4",   "AND abs 4",   "ROL abs 6",   "*RLA abs 6",
  "BMI rel 2++",  "AND izy 5+",   "*KIL impl -",  "*RLA izy 8",   "*NOP zpx 4",  "AND zpx 4",   "ROL zpx 6",   "*RLA zpx 6",
  "SEC impl 2",   "AND aby 4+",   "*NOP impl 2",  "*RLA aby 7",   "*NOP abx 4+", "AND abx 4+",  "ROL abx 7",   "*RLA abx 7",
  "RTI impl 6",   "EOR izx 6",    "*KIL impl -",  "*SRE izx 8",   "*NOP zp 3",   "EOR zp 3",    "LSR zp 5",    "*SRE zp 5",
  "PHA impl 3",   "EOR imm 2",    "LSR acc 2",    "*ALR imm 2",   "JMP abs 3",   "EOR abs 4",   "LSR abs 6",   "*SRE abs 6",
  "BVC rel 2++",  "EOR izy 5+",   "*KIL impl -",  "*SRE izy 8",   "*NOP zpx 4",  "EOR zpx 4",   "LSR zpx 6",   "*SRE zpx 6",
  "CLI impl 2",   "EOR aby 4+",   "*NOP impl 2",  "*SRE aby 7",   "*NOP abx 4+", "EOR abx 4+",  "LSR abx 7",   "*SRE abx 7",
  "RTS impl 6",   "ADC izx 6",    "*KIL impl -",  "*RRA izx 8",   "*NOP zp 3",   "ADC zp 3",    "ROR zp 5",    "*RRA zp 5",
  "PLA impl 4",   "ADC imm 2",    "ROR acc 2",    "*ARR imm 2",   "JMP ind 5",   "ADC abs 4",   "ROR abs 6",   "*RRA abs 6",
  "BVS rel 2++",  "ADC izy 5+",   "*KIL impl -",  "*RRA izy 8",   "*NOP zpx 4",  "ADC zpx 4",   "ROR zpx 6",   "*RRA zpx 6",
  "SEI impl 2",   "ADC aby 4+",   "*NOP impl 2",  "*RRA aby 7",   "*NOP abx 4+", "ADC abx 4+",  "ROR abx 7",   "*RRA abx 7",
  "*NOP imm 2",   "STA izx 6",    "*NOP imm 2",   "*SAX izx 6",   "STY zp 3",    "STA zp 3",    "STX zp 3",    "*SAX zp 3",
  "DEY impl 2",   "*NOP imm 2",   "TXA impl 2",   "*XAA imm 2",   "STY abs 4",   "STA abs 4",   "STX abs 4",   "*SAX abs 4",
  "BCC rel 2++",  "STA izy 6",    "*KIL impl -",  "*AHX izy 6",   "STY zpx 4",   "STA zpx 4",   "STX zpy 4",   "*SAX zpy 4",
  "TYA impl 2",   "STA aby 5",    "TXS impl 2",   "*TAS aby 5",   "*SHY abx 5",  "STA abx 5",   "*SHX aby 5",  "*AHX aby 5",
  "LDY imm 2",    "LDA izx 6",    "LDX imm 2",    "*LAX izx 6",   "LDY zp 3",    "LDA zp 3",    "LDX zp 3",    "*LAX zp 3",
  "TAY impl 2",   "LDA imm 2",    "TAX impl 2",   "*LAX imm 2",   "LDY abs 4",   "LDA abs 4",   "LDX abs 4",   "*LAX abs 4",
  "BCS rel 2++",  "LDA izy 5+",   "*KIL impl -",  "*LAX izy 5+",  "LDY zpx 4",   "LDA zpx 4",   "LDX zpy 4",   "*LAX zpy 4",
  "CLV impl 2",   "LDA aby 4+",   "TSX impl 2",   "*LAS aby 4+",  "LDY abx 4+",  "LDA abx 4+",  "LDX aby 4+",  "*LAX aby 4+",
  "CPY imm 2",    "CMP izx 6",    "*NOP imm 2",   "*DCP izx 8",   "CPY zp 3",    "CMP zp 3",    "DEC zp 5",    "*DCP zp 5",
  "INY impl 2",   "CMP imm 2",    "DEX impl 2",   "*AXS imm 2",   "CPY abs 4",   "CMP abs 4",   "DEC abs 6",   "*DCP abs 6",
  "BNE rel 2++",  "CMP izy 5+",   "*KIL impl -",  "*DCP izy 8",   "*NOP zpx 4",  "CMP zpx 4",   "DEC zpx 6",   "*DCP zpx 6",
  "CLD impl 2",   "CMP aby 4+",   "*NOP impl 2",  "*DCP aby 7",   "*NOP abx 4+", "CMP abx 4+",  "DEC abx 7",   "*DCP abx 7",
  "CPX imm 2",    "SBC izx 6",    "*NOP imm 2",   "*ISC izx 8",   "CPX zp 3",    "SBC zp 3",    "INC zp 5",    "*ISC zp 5",
  "INX impl 2",   "SBC imm 2",    "NOP impl 2",   "*SBC imm 2",   "CPX abs 4",   "SBC abs 4",   "INC abs 6",   "*ISC abs 6",
  "BEQ rel 2++",  "SBC izy 5+",   "*KIL impl -",  "*ISC izy 8",   "*NOP zpx 4",  "SBC zpx 4",   "INC zpx 6",   "*ISC zpx 6",
  "SED impl 2",   "SBC aby 4+",   "*NOP impl 2",  "*ISC aby 7",   "*NOP abx 4+", "SBC abx 4+",  "INC abx 7",   "*ISC abx 7",
]
