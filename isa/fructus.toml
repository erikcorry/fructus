# --- unary operations -------------------------------------------------------
# A unary operation is a binary operation whose 3-bit immediate selects the
# OPERATION instead of supplying a value.  The encoding is the reg-reg-imm3
# shape reused byte for byte - same split immediate, same register positions,
# same two-opcode pair - so register decode and field extraction are untouched.
#
# AND THE THREE BITS ARE READ THROUGH THE imm3 TABLE, like every other form in
# these columns.  The hardware selects the operation with bits 2:1 of the imm3
# VALUE, after the lookup, on the right-hand-side bus the ALU already reads -
# so no selector lines run from decode to the ALU, and each operation sits at
# the index whose value carries its code.  See the byte-serial core's unary.sv.
#
#     byte 0:  0 0 1 1 0 0 1 s    opcode pair 0x32/0x33, s = index bit 0
#     byte 1:  s s a a a d d d    index bits 2 and 1, source, destination
#
# Once an operation is named its index is constant, so each one below has a
# fully literal encoding and takes no selector operand - those bits are simply
# opcode bits to the assembler.
#
#     index  value  rhs[2:1]  mnemonic   byte 0  byte 1 high bits
#       0     -1       11     -- free     0x32   00
#       1      0       00     clz         0x33   00     TENTATIVE
#       2      1       00     clmul       0x32   01     TENTATIVE, fast
#       3      2       01     -- free     0x33   01     (clmul, slow)
#       4      3       01     bitrev      0x32   10     TENTATIVE
#       5      4       10     popcount    0x33   10     TENTATIVE
#       6      6       11     sxt8        0x32   11
#       7      8       00     -- free     0x33   11
#
# SIX OPERATIONS, NOT EIGHT.  Each opcode's two free indices read rhs[2:1] codes
# its operations already use, so each opcode holds three: a pair told apart by
# rhs[2], and a third that alone has the other value of rhs[1].  Only the
# opcode with a third operation pays for it, with one more select line into
# the unary block and a three-way mux instead of a two-way one.
#
# THE SLOW PAIR HAS AN OPCODE OF ITS OWN.  clz and popcount are the two deep
# operations: measured, taking both out of the single-cycle ALU was worth a
# tenth of the processor's clock, and taking either alone was not, because they
# are equally deep.  So both sit at 0x33 and take one cycle more than their
# length, with their result registered between the two - see `extra_cycles` -
# while sxt8 and bitrev, which are wiring, share 0x32 at one cycle per byte.
# The microcode's entry points are per opcode, which is why the split has to
# fall on the opcode and not on byte 1.
#
# THERE IS NO zxt8.  Zero extension in place is `and rd, rd, #0x00ff`, two bytes
# through immask5, and between registers `and rd, ra, #255`, three through
# imm10.  zxt8 bought only the separate source register, and a unary block
# with four operations selects on two bits rather than three.
#
# neg and inv are deliberately absent: `rsb rd, ra, #0` and `xor rd, ra, #-1`
# already express them in two bytes, and both 0 and -1 are in the imm3 table.
# sxt8 is here because it has no equally cheap shortcut: sign extension would
# be a shl/asr pair costing four bytes.

[[insn]]
mnemonic = "sxt8"
summary  = "rd = ra sign extended from 8 bits"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
]
syntax   = "{d}, {a}"
semantics = "R[d] = sxt8(R[a])"

  [[insn.form]]
  name     = "reg_reg"
  encoding = "0011_0010  11aa_addd"

[[insn]]
mnemonic = "clz"
summary  = "rd = count of leading zeros in ra"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
]
syntax   = "{d}, {a}"
semantics = "R[d] = clz(R[a])"
# One cycle more than its two bytes: its result is registered halfway.  See
# `extra_cycles` in the cost model, and the slow pair above.
extra_cycles = 1

  [[insn.form]]
  name     = "reg_reg"
  encoding = "0011_0011  00aa_addd"

[[insn]]
mnemonic = "bitrev"
summary  = "rd = ra with its 16 bits reversed"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
]
syntax   = "{d}, {a}"
semantics = "R[d] = bitrev(R[a])"

  [[insn.form]]
  name     = "reg_reg"
  encoding = "0011_0010  10aa_addd"

[[insn]]
mnemonic = "popcount"
summary  = "rd = number of set bits in ra"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
]
syntax   = "{d}, {a}"
semantics = "R[d] = popcount(R[a])"
# One cycle more than its two bytes, like clz.
extra_cycles = 1

  [[insn.form]]
  name     = "reg_reg"
  encoding = "0011_0011  10aa_addd"

# clmul: the carry-less product of ra's two bytes, as a polynomial over GF(2).
# The operands are the low byte and the high byte of ONE register, which is
# what makes it a unary operation and lets it fit the two-register shape: the
# product of two bytes is 15 bits, so it fits the register the pair came from.
# The operation is commutative, so which byte is which does not matter.
#
# IT IS FAST, BECAUSE SLOW BOUGHT NOTHING.  It can sit on either opcode: at
# index 2 of 0x32 it is two LUT levels in the single-cycle ALU, at index 3 of
# 0x33 with `extra_cycles = 1` its partial products are registered like
# popcount's counts.  Measured both ways on the processor alone behind one
# SPRAM, medians of sixteen seeds:
#
#                           LUT4    cells    MHz     spread
#     without clmul         1292    1562    29.22   28.0 .. 30.3
#     clmul fast, 0x32      1345    1615    29.80   28.6 .. 30.3
#     clmul slow, 0x33      1344    1615    28.61   25.8 .. 29.8
#
# The same fifty-three cells either way - the slow form's flops sit in the
# cells of the LUT level in front of them - and neither median moves by more
# than the spread, so the extra cycle buys no clock.  Moving it back is the
# encoding's first byte, 0011_0011, and `extra_cycles = 1` - byte 1 is
# 01aa_addd at both, and the byte-serial core's gen-unary.js builds either.
[[insn]]
mnemonic = "clmul"
summary  = "rd = carry-less product of ra's low and high bytes"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
]
syntax   = "{d}, {a}"
semantics = "R[d] = clmul(R[a])"

  [[insn.form]]
  name     = "reg_reg"
  encoding = "0011_0010  01aa_addd"


# --- mul ---------------------------------------------------------------------
# The low sixteen bits of a product, in the unary row's four free columns with
# the ALU group's shapes: +0 imm5, +1 imm10, +6/+7 three registers.  There is
# no imm3 form - +2/+3 are the unary opcodes - and no mask forms, because a
# power of two is a shift and a mask is nothing to multiply by.
#
#     0x30  mul rd, rd, #imm5      2 bytes
#     0x31  mul rd, ra, #imm10     3 bytes
#     0x36  mul rd, ra, rb         2 bytes, with 0x37
#
# SIGNED AND UNSIGNED ARE THE SAME INSTRUCTION.  The low half of a product does
# not depend on how its operands are read, so one mul serves both and the
# immediates are sign extended like every other ALU group's: `mul rd, rd, #-3`
# is what it looks like.
#
# THE PRODUCT IS AN SB_MAC16's, AND IT IS REGISTERED, like popcount's counts.
# The DSP's own register sits after the adder that combines its four 8x8
# partial products, so the whole multiply happens in the SLOW step and EXEC
# reads a register.  See rtl/alu.sv for why the DSP is instantiated.
# A single-cycle multiply would be the deepest path in the machine: flop to
# DSP to flop measures about 16 ns under icetime, half of it routing to and
# from the DSP's column.  So each form takes one cycle more than its length.
#
# ALL FOUR OPCODES SHARE ONE TAIL.  Once the right-hand operand is in its flop
# they are the same instruction, so every form ends in SLOW and then EXEC; the
# three-byte form fetches its last byte on the way.  See the byte-serial core's ucode.sv.
#
# nextpnr-ice40 0.7 DOES NOT TIME THROUGH SB_MAC16, so `just speed` cannot see
# this path at all; icetime can.
#
# GCC DOES NOT USE IT YET.  The port has no mulhi3 pattern, so a multiply in C
# is still a call to libgcc's __mulhi3.

[[insn]]
mnemonic = "mul"
summary  = "rd = low 16 bits of ra * rb"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{d}, {a}, {b}"
semantics = "R[d] = R[a] * R[b]"
extra_cycles = 1

  [[insn.form]]
  name     = "three_reg"
  encoding = "0011_011b  ccaa_addd"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }

[[insn]]
mnemonic = "mul"
summary  = "rd = low 16 bits of ra * immediate"
operands = [
  { name = "d",   type = "reg"   },
  { name = "a",   type = "reg"   },
  { name = "imm", type = "int16" },
]
syntax   = "{d}, {a}, #{imm}"
semantics = "R[d] = R[a] * imm"
extra_cycles = 1

  [[insn.form]]
  name     = "reg_imm5"
  encoding = "0011_0000  iiii_iddd"
  fields   = { i = "imm:imm5" }
  tie      = { a = "d" }

  [[insn.form]]
  name     = "reg_reg_imm10"
  encoding = "0011_0001  iiaa_addd  jjjj_jjjj"
  fields   = { i = "imm:imm10[1:0]", j = "imm:imm10[9:2]" }


# --- br ---------------------------------------------------------------------
# Conditional subtract-and-branch.  The comparison is a subtract whose result
# is discarded; only the condition it sets is used, at 16-bit width.
#
# The two-register form is the `rsb` three-register encoding with its
# DESTINATION field replaced by a 3-bit condition, plus a displacement byte:
#
#     byte 0:  1 0 1 0 0 1 1 z    0xa6/0xa7
#     byte 1:  c c c b b b e e    condition, SECOND reg, first reg bits 2 and 1
#     byte 2:  t t t t t t t t    signed displacement from the next instruction
#
# BIT 3 IS CLEAR IN BOTH FORMS.  It was a width bit, putting a byte-wide row
# eight opcodes below this one the way st/st8 and ld/ld8 sit.  That row is free
# now and the bit is a constant.
#
# THE TWO REGISTERS ARE THE OTHER WAY ROUND FROM THE SYNTAX, and that is what
# lets the comparison be an `rsb` with no extra multiplexing.  `rsb rd, ra, rb`
# computes rb - ra: the SPLIT field minus the byte1[5:3] field.  `br cond, ra,
# rb` tests the flags of R[a] - R[b].  For those to be the same subtraction, the
# first register NAMED has to sit in the split field, so `a` takes z and ee
# while `b` takes byte1[5:3].
#
# Read as datapath rather than as syntax there is no reversal at all:
#
#     byte1[5:3]              always ALU port A
#     {byte1[7:6], opcode[0]} always ALU port B
#
# and every three-operand instruction in the map obeys it - the ALU triples, the
# shift triples, push and pop's triples, and now both branches.  rtl/immgen.sv
# emits port B's register number at +6 and +7 for all of them.
#
# Three of the register bits and all of the register decode are therefore
# shared with the ALU three-register forms; only byte 1's top field changes
# meaning.  Eight encoded conditions cover more than eight spellings because
# the two registers can be exchanged - see `cond3`.
#
# The single-register form replaces both the second register and the condition
# with one 5-bit index into the `condimm5` table, which supplies a condition
# and a constant together:
#
#     byte 0:  1 0 1 0 0 0 0 0    0xa0
#     byte 1:  a a a k k k k k    register, condition-and-constant index
#     byte 2:  t t t t t t t t    displacement
#
# BYTE 1 IS THE MASK BRANCHES' BYTE 1.  `aaak_kkkk` here and `aaam_mmmm` in
# brclr and brset are one register and five bits in the same places; only the
# table reading those five bits differs.  So these three share a row the way an
# ALU group's +0, +4 and +5 forms do, and for the same reason - see the opcode
# map at the top of this file.
[[insn]]
mnemonic      = "br"
summary       = "compare two registers and branch"
operands = [
  { name = "cond", type = "cond3" },
  { name = "a",    type = "reg"   },
  { name = "b",    type = "reg"   },
  { name = "off",  type = "int16", pcrel = true },
]
syntax        = "{cond}, {a}, {b}, {off}"
semantics = "if (test(cond, R[a], R[b], 16)) pc = pc + off"
swap_operands = ["a", "b"]

  [[insn.form]]
  name     = "cond_reg_reg"
  encoding = "1010_011z  eebb_bccc  tttt_tttt"
  fields   = { c = "cond:cond3", z = "a:reg[0]", e = "a:reg[2:1]", t = "off:off8" }

[[insn]]
mnemonic = "br"
summary  = "compare against a table constant and branch"
operands = [
  { name = "k",   type = "condimm5" },
  { name = "a",   type = "reg" },
  { name = "off", type = "int16", pcrel = true },
]
syntax   = "{k.cond}, {a}, #{k.imm}, {off}"
semantics = "if (test(k.cond, R[a], k.imm, 16)) pc = pc + off"

  [[insn.form]]
  name     = "cond_reg_imm"
  encoding = "1010_0000  kkkk_kaaa  tttt_tttt"
  fields   = { k = "k:condimm5", t = "off:off8" }


# --- brset / brclr --------------------------------------------------------
# Branch on a masked test of one register: `ra & mask` against zero.
#
#     brclr ra, #mask, target      taken when (ra & mask) == 0
#     brset ra, #mask, target      taken when (ra & mask) != 0
#
# The mask is an immbit5, so the two of them together cover every single bit of
# every register in both senses - which is all they used to do - plus every
# ALL-BUT-ONE-BIT test, which is new and is what the fifth bit used to be spent
# on.  `brclr r0, #0x7fff, L` branches when nothing but the sign bit is set.
#
# THESE ARE TWO OPCODES NOW, and the bit that separates them is exactly the bit
# that separates `eq` from `ne` in cond3 - which is what they are: the mask
# feeds the ALU, the result is compared with zero, and the opcode carries the
# condition.  Nothing new is needed in the compare path.
#
#     byte 0:  1 0 0 0 0 1 1 e    0x96 = eq (brclr), 0x97 = ne (brset)
#     byte 1:  a a a m m m m m    register, immbit5 mask
#     byte 2:  t t t t t t t t    displacement
#
# THE OPERAND IS A MASK, NOT A BIT NUMBER.  `brset ra, #0x8000` tests the sign
# bit; `brset ra, #15` is not an instruction, because 15 has four bits set and
# immbit5 holds no such value.  The assembler rejects it rather than guessing,
# which is the right outcome for a change of meaning this quiet.
[[insn]]
mnemonic = "brclr"
summary  = "branch if ra & mask is zero"
operands = [
  { name = "a",    type = "reg"   },
  { name = "mask", type = "int16" },
  { name = "off",  type = "int16", pcrel = true },
]
syntax   = "{a}, #{mask}, {off}"
semantics = "if ((R[a] & mask) == 0) pc = pc + off"

  [[insn.form]]
  name     = "reg_mask"
  encoding = "1010_0100  mmmm_maaa  tttt_tttt"
  fields   = { m = "mask:immbit5", t = "off:off8" }

  # The same test against the mask table instead of a single bit - branch on
  # whether a whole FIELD is empty.  Same byte 1, same 5 bits, different table:
  # +4 of the row reads them as immbit5 and +5 reads them as immask5, which is
  # the relationship every ALU group has between its two mask forms.  Clear and
  # set are separated by BIT 3 rather than bit 0 - brclr is the upper row and
  # brset the row eight below - so both spellings of each land in one column.
  [[insn.form]]
  name     = "reg_mask5"
  encoding = "1010_0101  mmmm_maaa  tttt_tttt"
  fields   = { m = "mask:immask5", t = "off:off8" }

[[insn]]
mnemonic = "brset"
summary  = "branch if ra & mask is non-zero"
operands = [
  { name = "a",    type = "reg"   },
  { name = "mask", type = "int16" },
  { name = "off",  type = "int16", pcrel = true },
]
syntax   = "{a}, #{mask}, {off}"
semantics = "if ((R[a] & mask) != 0) pc = pc + off"

  [[insn.form]]
  name     = "reg_mask"
  encoding = "1010_1100  mmmm_maaa  tttt_tttt"
  fields   = { m = "mask:immbit5", t = "off:off8" }

  # The same test against the mask table instead of a single bit - branch on
  # whether a whole FIELD is empty.  Same byte 1, same 5 bits, different table:
  # +4 of the row reads them as immbit5 and +5 reads them as immask5, which is
  # the relationship every ALU group has between its two mask forms.  Clear and
  # set are separated by BIT 3 rather than bit 0 - brclr is the upper row and
  # brset the row eight below - so both spellings of each land in one column.
  [[insn.form]]
  name     = "reg_mask5"
  encoding = "1010_1101  mmmm_maaa  tttt_tttt"
  fields   = { m = "mask:immask5", t = "off:off8" }



# --- iseq / isset -----------------------------------------------------------
# TWO INSTRUCTIONS IN ONE ROW, and which one you get depends on the column.
#
#     iseq  rd, a, b     rd = (a == b)      1 or 0
#     isset rd, a, b     rd = (a & b) != 0  1 or 0
#
# That looks irregular and is the same shape br already has: brclr and brset
# read the same five bits through immbit5 and immask5 and mean different things
# by column, and the ALU's +4 and +5 are per-operation rather than universal.
# The rule here is simply that the mask columns take `isset` and everything else
# takes `iseq`:
#
#     +0   iseq  rd, rd, #imm5        is this register some small constant
#     +1   iseq  rd, ra, #imm10       is this register some wide constant
#     +2   iseq  rd, ra, #imm3        TWO opcodes
#     +3     "
#     +4   isset rd, rd, #immbit5     EXTRACT ONE BIT, as a 0 or 1
#     +5   isset rd, rd, #immask5     is any bit of this field set
#     +6   iseq  rd, ra, rb           TWO opcodes
#     +7     "
#
# THE ONLY NEW DECODE IS WHICH COMPARATOR, and it is hard-wired to the low three
# bits: +4 and +5 are `set`, the other six are `eq`.  No operand chooses it, no
# microcode line carries it, and the immediate reaches the comparator down the
# same path it reaches the ALU - rtl/immgen.sv already produces imm5, immbit5,
# imm3, imm10 and immask5 from those columns for every other row in the map.
#
# WHAT IT BUYS.  Three things, and the third is the one that motivated it.
#
#   A ONE-BIT EXTRACT.  `isset rd, rd, #immbit5` is bit n of a register as a 0
#   or a 1, in two bytes, with no shift and no mask-then-compare.
#
#   BRANCHLESS SELECTION.  A predicate as a VALUE rather than as control flow -
#   which on a machine whose taken branches cost an extra cycle, and whose
#   pipeline will be shorter than its memory, is often the cheaper shape.
#
#   BOOL-RETURNING FUNCTIONS WITH NO BRANCH AT ALL.  A C function returning
#   `a == b` compiles to one `iseq` and a `ret`, where before it needed a
#   branch, two `mov`s and a join.  That is the case a compiler hits constantly
#   and the reason this earns a row.
#
# The result is 1 or 0 and never anything else, so `xor rd, rd, #1` inverts a
# predicate - which is why the one-byte `xor r0, r0, #1` exists at 1000_0100.
# `!=` from a bool-returning function is one byte.

[[insn]]
mnemonic = "iseq"
summary  = "rd = 1 if ra equals rb, else 0"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{d}, {a}, {b}"
semantics = "R[d] = R[a] == R[b]"

  [[insn.form]]
  name     = "three_reg"
  encoding = "0111_111b  ccaa_addd"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }

[[insn]]
mnemonic = "iseq"
summary  = "rd = 1 if ra equals a constant, else 0"
operands = [
  { name = "d",   type = "reg" },
  { name = "a",   type = "reg" },
  { name = "imm", type = "int16" },
]
syntax   = "{d}, {a}, #{imm}"
# The immediate is compared as a 16-bit PATTERN.  Written `R[a] == imm' this
# compared a register, which is 0..65535, against the signed value decoded
# from imm10 - so `iseq r0, r0, #-205' was false for r0 = -205, where the
# comparator sees 0xff33 on both ports.  The compiler found it.
semantics = "R[d] = R[a] == (imm & 0xffff)"

  [[insn.form]]
  name     = "reg_imm5"
  encoding = "0111_1000  iiii_iddd"
  fields   = { i = "imm:imm5" }
  tie      = { a = "d" }

  [[insn.form]]
  name     = "reg_reg_imm3"
  encoding = "0111_101i  jjaa_addd"
  fields   = { i = "imm:imm3[0]", j = "imm:imm3[2:1]" }

  [[insn.form]]
  name     = "reg_reg_imm10"
  encoding = "0111_1001  iiaa_addd  jjjj_jjjj"
  fields   = { i = "imm:imm10[1:0]", j = "imm:imm10[9:2]" }

[[insn]]
mnemonic = "isset"
summary  = "rd = 1 if ra and the mask share a bit, else 0"
operands = [
  { name = "d",    type = "reg" },
  { name = "a",    type = "reg" },
  { name = "mask", type = "int16" },
]
syntax   = "{d}, {a}, #{mask}"
semantics = "R[d] = (R[a] & mask) != 0"

  [[insn.form]]
  name     = "reg_immbit5"
  encoding = "0111_1100  iiii_iddd"
  fields   = { i = "mask:immbit5" }
  tie      = { a = "d" }

  [[insn.form]]
  name     = "reg_immask5"
  encoding = "0111_1101  iiii_iddd"
  fields   = { i = "mask:immask5" }
  tie      = { a = "d" }

# --- push / pop -------------------------------------------------------------
# Push and pop are separate microcode state machines and the first opcode
# selects which, so nothing here is shared between them.
#
# THE TWO WIDTHS HAVE DIFFERENT JOBS, and that is what sets the shape of this
# block.  8-bit push and pop exist for ARGUMENTS: a char on the stack is one
# byte, pushed on its own, and there is never a reason to move two of them at
# once.  16-bit push and pop exist for SAVING REGISTERS across a call, which is
# always several at a time and always in a fixed order.  So the byte forms are
# single-register only and the word forms come in ones, twos and threes.
#
#     push8  ra                       one byte, one register
#     pop8   ra                       zero extended
#     push ra                       one word
#     push ra, rb                   two
#     push ra, rb, rc               three - TWO opcodes
#     pop  ra   / ra, rb / ra, rb, rc
#
# EVERY ONE OF THESE IS WRITTEN BY HAND.  There is no coalescing: the assembler
# does not merge adjacent pushes and the disassembler does not split them, so
# what is written is what runs.  An earlier version had the assembler fuse
# singles into pairs, which meant the register-saving cost of a function was a
# property of the assembler rather than of the source - fine until two adjacent
# pushes were separated by an edit and the prologue silently grew.
#
# There is still no register-mask form.  A mask means a variable-length loop
# over a bitmap, which is exactly the wrong shape for interrupt latency; three
# registers is a fixed three-store sequence the microcode can hard-code, and
# worst-case latency stays bounded.  Three is also enough: with r5 caller saved
# there is only one callee-saved register, so the common prologue is
# `push lr, r4` and the three-register form is for spilling arguments.
#
# BYTE 1 IS THE SAME EVERYWHERE.  Registers occupy fixed 3-bit fields and
# nothing else lives there - no width bit, no sign bit, no count:
#
#     one register:     aaa0_0000
#     two registers:    aaab_bb00
#     three registers:  aaab_bbcc      + the low bit of rc in the opcode
#
# The three-register forms steal an opcode bit for the ninth register bit,
# exactly as the three-register ALU forms do - same trick, same reason.
#
#     0x90  push ra              0x98  pop  ra
#     0x91  stm  ra              0x99  ldm  ra
#     0x92  push ra, rb          0x9a  pop  ra, rb
#     0x93  stm  ra, rb          0x9b  ldm  ra, rb
#     0x94  stm  ra, rb, rc      0x9c  ldm  ra, rb, rc
#     0x95    "                  0x9d    "
#     0x96  push ra, rb, rc      0x9e  pop  ra, rb, rc
#     0x97    "                  0x9f    "
#
# THE ROW IS FULL, and the four even slots that were `push8` and `pop8` are
# what made the three-register block moves possible: a third register needs an
# opcode bit, so it needs an ADJACENT EVEN/ODD PAIR, and every odd slot in this
# row was already free while every even one was taken.  See the stm/ldm section
# below for what replaced them and why the byte forms were affordable to lose.
#
# ORDER.  A push writes its registers left to right, and the stack grows down,
# so the FIRST register named lands at the HIGHEST address.  A pop reads left to
# right too, so it takes them off in the order they come, and a save/restore
# pair reverses the register list:
#
#     push lr, r4, r5   ...   pop r5, r4, lr
#
# So a 32-bit value in r0:r1, low half in r0, is pushed as `push r1, r0` - the
# high half named first lands higher, which is little endian.  See isa/abi.s.
#
# THE POINTER IS UPDATED AFTER THE TRANSFER, and that settles what it means to
# name the pointer in its own register list - the question that has bitten both
# ARM and x86.  It is defined here rather than forbidden:
#
#     push sp    stores sp AS IT WAS when the instruction started
#     pop  sp    has no effect on sp: it is left holding the stepped pointer,
#                and the word that was loaded into it is discarded
#
# and the same for `stm r1` and `ldm r2`.  Neither case is useful, but both are
# well defined, and no assembler has to know about them.
#
# IT IS ALSO WHAT THE HARDWARE DOES FOR ITS OWN REASONS.  The register file has
# ONE write port, and a pop already fills it with the words it is loading, so
# the pointer's own write is left until last - see the byte-serial core's ucode.sv.  The rule above
# is that ordering, described rather than imposed.
#
# THE SEMANTICS BELOW SAY SO with a name for the pointer's entry value, `base`.
# Every address is an offset from it, so nothing a load writes can disturb an
# address still to be used; and the pointer's assignment is last, so it wins.
# tools/sim.js gives any name that is not a register a life of one instruction.

[[insn]]
mnemonic = "push"
summary  = "push ra"
operands = [{ name = "a", type = "reg" }]
syntax   = "{a}"
semantics = "base = sp; M16[base - 2] = R[a]; sp = base - 2"

  [[insn.form]]
  name     = "single"
  encoding = "1001_0000  0000_0aaa"

[[insn]]
mnemonic = "push"
summary  = "push ra then rb"
operands = [{ name = "a", type = "reg" }, { name = "b", type = "reg" }]
syntax   = "{a}, {b}"
semantics = "base = sp; M16[base - 2] = R[a]; M16[base - 4] = R[b]; sp = base - 4"

  [[insn.form]]
  name     = "double"
  encoding = "1001_0010  00bb_baaa"

[[insn]]
mnemonic = "push"
summary  = "push ra, then rb, then rc"
operands = [{ name = "a", type = "reg" }, { name = "b", type = "reg" },
            { name = "c", type = "reg" }]
syntax   = "{a}, {b}, {c}"
semantics = "base = sp; M16[base - 2] = R[a]; M16[base - 4] = R[b]; M16[base - 6] = R[c]; sp = base - 6"

  [[insn.form]]
  name     = "triple"
  encoding = "1001_011z  ccbb_baaa"
  fields   = { z = "c:reg[0]", c = "c:reg[2:1]" }


# --- pop --------------------------------------------------------------------
# THERE ARE NO BYTE-WIDE STACK OPERATIONS.  `push8` and `pop8` were here and
# are gone; the four opcodes they held are the three-register stm and ldm
# below, which could not have existed without them.
#
# WHAT IT COSTS.  The ABI still passes a byte argument on the stack UNPADDED -
# see isa/abi.s - so a caller that puts one there writes the two-instruction
# form instead, `add sp, sp, #-1` and then `st8`.  That is four bytes where
# `push8` was two.  It is a rare shape: it needs a function with more arguments
# than the registers carry AND a byte among the ones that spill, and a compiler
# usually sinks the whole frame's adjustment into one `add` and fills the slots
# with stores anyway.  Block moves are common and that trade is the point.
#
# `pop8` was rarer still - nothing in libc, nothing in libgcc, and no pattern
# in the compiler emitted it.
[[insn]]
mnemonic = "pop"
summary  = "pop a word into ra"
operands = [{ name = "a", type = "reg" }]
syntax   = "{a}"
semantics = "base = sp; R[a] = M16[base]; sp = base + 2"

  [[insn.form]]
  name     = "single"
  encoding = "1001_1000  0000_0aaa"

[[insn]]
mnemonic = "pop"
summary  = "pop two words, into ra then rb"
operands = [{ name = "a", type = "reg" }, { name = "b", type = "reg" }]
syntax   = "{a}, {b}"
semantics = "base = sp; R[a] = M16[base]; R[b] = M16[base + 2]; sp = base + 4"

  [[insn.form]]
  name     = "double"
  encoding = "1001_1010  00bb_baaa"

[[insn]]
mnemonic = "pop"
summary  = "pop three words, into ra then rb then rc"
operands = [{ name = "a", type = "reg" }, { name = "b", type = "reg" },
            { name = "c", type = "reg" }]
syntax   = "{a}, {b}, {c}"
semantics = "base = sp; R[a] = M16[base]; R[b] = M16[base + 2]; R[c] = M16[base + 4]; sp = base + 6"

  [[insn.form]]
  name     = "triple"
  encoding = "1001_111z  ccbb_baaa"
  fields   = { z = "c:reg[0]", c = "c:reg[2:1]" }


# --- stm / ldm: the block moves ---------------------------------------------
# push and pop walk the stack; these walk a buffer, and they are the same
# hardware doing it.  `stm` stores through r1 and `ldm` loads through r2, each
# stepping its pointer past what it moved - so a copy loop is `ldm` then `stm`
# with no pointer arithmetic between them at all, and the two pointers advance
# themselves.
#
# THE POINTER IS NAMED, NOT ENCODED, exactly as sp is for push and pop.  That
# is what leaves all of byte 1 for the registers being moved, which is what
# makes a three-register form fit in two bytes.  r1 for the store and r2 for
# the load, so that a copy can hold both at once, and neither is sp.
#
# THEY COUNT UP, where push counts down.  A block move runs forwards, and the
# post-update leaves each pointer one past the last byte it moved - ready for
# the next iteration with nothing to add.
#
# WHY THEY ARE WORTH FOUR OPCODES.  snippets/memcpy.s's fastest rung reaches
# its speed by pointing sp at the buffers and using push and pop, and then
# spends more than a third of its cycles handing sp back and forth between the
# source and the destination.  These have no handover at all: the pointers are
# different registers and each one updates itself.
#
# THE ORDER IS THE SAME AS push's: the first register named is stored first, so
# with a pointer that counts up it lands at the LOWEST address.  A save through
# stm and a reload through ldm therefore take the SAME register list, where a
# push/pop pair reverses it.
[[insn]]
mnemonic = "stm"
summary  = "store ra through r1, stepping r1 past it"
operands = [{ name = "a", type = "reg" }]
syntax   = "{a}"
semantics = "base = r1; M16[base] = R[a]; r1 = base + 2"

  [[insn.form]]
  name     = "single"
  encoding = "1001_0001  0000_0aaa"

[[insn]]
mnemonic = "stm"
summary  = "store ra then rb through r1"
operands = [{ name = "a", type = "reg" }, { name = "b", type = "reg" }]
syntax   = "{a}, {b}"
semantics = "base = r1; M16[base] = R[a]; M16[base + 2] = R[b]; r1 = base + 4"

  [[insn.form]]
  name     = "double"
  encoding = "1001_0011  00bb_baaa"

[[insn]]
mnemonic = "stm"
summary  = "store ra, then rb, then rc through r1"
operands = [{ name = "a", type = "reg" }, { name = "b", type = "reg" },
            { name = "c", type = "reg" }]
syntax   = "{a}, {b}, {c}"
semantics = "base = r1; M16[base] = R[a]; M16[base + 2] = R[b]; M16[base + 4] = R[c]; r1 = base + 6"

  [[insn.form]]
  name     = "triple"
  encoding = "1001_010z  ccbb_baaa"
  fields   = { z = "c:reg[0]", c = "c:reg[2:1]" }

[[insn]]
mnemonic = "ldm"
summary  = "load ra through r2, stepping r2 past it"
operands = [{ name = "a", type = "reg" }]
syntax   = "{a}"
semantics = "base = r2; R[a] = M16[base]; r2 = base + 2"

  [[insn.form]]
  name     = "single"
  encoding = "1001_1001  0000_0aaa"

[[insn]]
mnemonic = "ldm"
summary  = "load ra then rb through r2"
operands = [{ name = "a", type = "reg" }, { name = "b", type = "reg" }]
syntax   = "{a}, {b}"
semantics = "base = r2; R[a] = M16[base]; R[b] = M16[base + 2]; r2 = base + 4"

  [[insn.form]]
  name     = "double"
  encoding = "1001_1011  00bb_baaa"

[[insn]]
mnemonic = "ldm"
summary  = "load ra, then rb, then rc through r2"
operands = [{ name = "a", type = "reg" }, { name = "b", type = "reg" },
            { name = "c", type = "reg" }]
syntax   = "{a}, {b}, {c}"
semantics = "base = r2; R[a] = M16[base]; R[b] = M16[base + 2]; R[c] = M16[base + 4]; r2 = base + 6"

  [[insn.form]]
  name     = "triple"
  encoding = "1001_110z  ccbb_baaa"
  fields   = { z = "c:reg[0]", c = "c:reg[2:1]" }


# --- jmp / call / ret -------------------------------------------------------
# Five opcodes.  The wide immediate is the `mov rd, #imm16` shape with the
# register field spent on the opcode instead, so these reuse the same fetch
# path: opcode byte, then a 16-bit value low byte first.
#
# Relative and absolute both take a full 16 bits and both reach the whole
# address space, so the choice between them is not about range - it is whether
# the code is position independent.  Short relative jumps are already covered
# by the two-byte `jmpr` form at 0xa1, +/-127.
#
# THE WIDE RELATIVE FORMS ARE GONE, and what they cost is why.  `jmpr target'
# and `callr target' were three bytes reaching the whole address space
# relatively; `jmp' and `call' are three bytes reaching it absolutely, and a
# relative target costs a CYCLE MORE because the adder and the verdict land in
# flops an edge later than the instruction's own bytes do - see the timings in
# the byte-serial core's cpu.sv.  Three bytes and four cycles against three and three, for
# position independence that a machine with a linker and no address-space
# randomisation never asked for.
#
# So .2 and .a hold jmp and call, one bit apart with the same byte 1, and .3
# and .b are free.  What is lost with them is real and worth writing down:
# code that must run at an address it was not linked for can no longer jump
# further than a byte's displacement without a register.  The short `jmpr' at
# .1 stays, because two bytes for a local jump is worth having and its reach
# is exactly a loop's.
#
# MNEMONICS.  `jmp` and `call` are absolute; `jmpr` is the two-byte relative
# form and the only relative transfer left.  An assembler that wanted one
# mnemonic could relax `jmpr` into `jmp` when the displacement does not fit -
# same three bytes, one cycle cheaper - which is what gcc's jump pattern does
# for itself.
[[insn]]
mnemonic = "jmpr"
summary  = "pc += displacement"
operands = [{ name = "target", type = "int16", pcrel = true }]
syntax   = "{target}"
semantics = "pc = pc + target"

  # THE SHORT FORM IS A BRANCH WEARING A JUMP'S NAME, and the encoding says so:
  # 0xa1 is the compare-and-branch datapath with its condition pinned to
  # `eq, r0, r0`.  A register compared for equality with itself is always true,
  # so the condition field costs nothing and the whole instruction is an opcode
  # and a displacement byte.
  #
  # It used to be spelled `br` and it is not a branch to a programmer: it takes
  # no condition and no registers, it is exactly `jmpr` with a shorter reach.
  # So it is a FORM rather than an instruction, and the assembler picks between
  # two and three bytes by how far the target is - which is what it does for
  # every other operand that has more than one width.
  [[insn.form]]
  name     = "rel8"
  encoding = "1010_0011  tttt_tttt"
  fields   = { t = "target:off8" }

[[insn]]
mnemonic = "jmp"
summary  = "pc = imm16"
operands = [{ name = "target", type = "int16" }]
syntax   = "{target}"
semantics = "pc = target"

  [[insn.form]]
  name     = "abs16"
  encoding = "1010_0001  iiii_iiii  jjjj_jjjj"
  fields   = { i = "target:int16[7:0]", j = "target:int16[15:8]" }

# Return is just pc = lr, so it needs no operands and fits in one byte - and
# being one byte is what decides where it lives.
#
# IT IS A PC WRITER OUTSIDE 1001_xxxx, deliberately - one of two now that
# `jmp r5` has joined it at 0x02.  The control-flow block is exactly two rows
# and holds exactly sixteen instructions once the two mask branches come home
# to their columns; ret is the seventeenth, and it was the only one-byte
# instruction living out there until jmp arrived.  Every other one-byte opcode
# is in x000_0xxx, so that is where both of them go.
#
# It fits that region on its own terms rather than as an exile.  The one-byte
# block is instructions with nothing left to say - `add r0, r0, #1`, `mov r0,
# #0`, `ld` with its register implied - and `ret` is `jmp lr` with its operand
# implied, which is the same kind of thing.  It is also, after the ALU, the
# most executed instruction in any program, which is what a one-byte opcode is
# for.
#
# Nothing decodes worse for it: decode is a flat 256-entry table and always was,
# so "the pc writers are 1001_xxxx" is a claim about how the map READS, not a
# mask any hardware applies.
[[insn]]
mnemonic = "call"
summary  = "lr = pc of next instruction; pc = imm16"
operands = [{ name = "target", type = "int16" }]
syntax   = "{target}"
semantics = "lr = pc; pc = target"

  [[insn.form]]
  name     = "abs16"
  encoding = "1010_1001  iiii_iiii  jjjj_jjjj"
  fields   = { i = "target:int16[7:0]", j = "target:int16[15:8]" }

# --- the indirect call ------------------------------------------------------
# `call rX` is `call imm16` with the target coming from the register file
# instead of the instruction stream: same lr write, same jump, one less fetch.
# Two bytes.
#
# IT IS NOT OPTIONAL FOR C.  Before it existed, `ret` was the only transfer
# that read a register, so a function pointer could be tail called - `mov lr,
# rX` then `ret` - and nothing else.  There was no way to arrange a return
# address, because the only instruction that could jump to a register was the
# one that consumed the register holding it.  Function pointers, vtables and
# qsort all need this opcode.
#
# There is deliberately no `jmp rX`.  An indirect tail call is `mov lr, rX`
# followed by `ret`, three bytes, and it is rare enough not to be worth an
# opcode of its own - whereas the two-byte indirect call is on the hot path of
# every dynamic dispatch.
[[insn]]
mnemonic = "call"
summary  = "lr = pc of next instruction; pc = ra"
operands = [{ name = "a", type = "reg" }]
syntax   = "{a}"
semantics = "lr = pc; pc = R[a]"

  [[insn.form]]
  name     = "reg"
  encoding = "1010_1010  0000_0aaa"

[[insn]]
mnemonic = "ret"
summary  = "pc = lr"
operands = []
syntax   = ""
semantics = "pc = lr"

  [[insn.form]]
  encoding = "1010_1011"


# A JUMP THROUGH A REGISTER, WHICH THE MACHINE OTHERWISE HAS NO WAY TO SPELL.
# Without it an indirect jump has to go `mov lr, ra` and `ret`, which costs
# three bytes and, far worse, destroys lr - so a function with a switch table
# had to save lr as if it made calls, and a tail call through a function
# pointer was impossible outright, since lr is holding the return address the
# tail call exists to pass on.
#
# IT TAKES ANY REGISTER, IN TWO BYTES.  It was one byte with r5 pinned, on the
# argument that a general form would want eight opcodes and that every use -
# a switch table, a tail call through a pointer, a dispatch - can choose which
# register holds the address.  The second half of that is true and the first
# half was the wrong shape: one opcode and a byte of register field is two
# bytes, not eight opcodes, and it costs the SAME THREE CYCLES either way,
# because what this instruction pays for is reading a register, not fetching a
# byte.  So the pin bought one byte of code and charged for it in register
# allocation - every indirect jump had to get its address into the one
# register the assembler is also free to clobber.
#
# ret IS THE COMPACT FORM THAT SURVIVES, and it is the one worth keeping: `pc
# = lr` needs no operand at all, so it is one byte with nothing implied that a
# caller has to arrange.
#
# IT SITS AT 1010_1011 RATHER THAN 0x01, which trades one argument for two.
# What it gives up: at 0x01 a wild jump into erased memory found halt and then
# an unwind, which was a deliberate bit of damage control.  What it buys: the
# one-byte region is sixteen opcodes and the control block had a free slot, so
# the scarcer space keeps its slot; and `every program transfer of control is
# 1010_xxxx` holds without exception, which is worth more than it sounds - it
# is the kind of claim a decoder, a disassembler and a reader all lean on.
#
# THE SLOT IT LEFT IS HALT, and the damage control came back stronger than it
# went away.  0x00, 0x01 and 0x02 are brk, halt and rti now, so a wild jump into
# a zeroed page traps to a handler that can name the faulting address rather
# than unwinding to wherever lr happened to point.
[[insn]]
mnemonic = "jmp"
summary  = "pc = ra"
operands = [
  { name = "a", type = "reg" },
]
syntax   = "{a}"
semantics = "pc = R[a]"

  [[insn.form]]
  name     = "reg"
  encoding = "1010_0010  0000_0aaa"


# --- sei / cli --------------------------------------------------------------
# THE INTERRUPT-ENABLE FLAG IS WRITE-ONLY, and deliberately so.  There is no
# instruction that reads it and no way to save and restore it, so a critical
# section is `cli` ... `sei` and the code is expected to know which state it was
# in.  A readable flag invites the save-and-restore idiom, which needs a
# register to hold it and a conditional to act on it - and on a machine with
# eight registers that is a real cost paid at every critical section, to buy
# nesting that hand-written kernel code can simply not do.
#
# THEY ARE ONE BYTE AND THEY ARE IN THE CONTROL ROW, which costs the length
# decode something and is the one place this pair is not free.  `ret` at .b was
# the row's only one-byte member; .e and .f make three, so a decoder reading
# length from the bits alone needs `.b, .e, .f` rather than a single exception.
# The alternative was two of the sixteen one-byte opcodes, and those are worth
# more: they hold abbreviations that save a byte at thousands of sites, where
# sei and cli appear a few dozen times in a whole kernel.  Spending the scarcer
# space on the rarer instruction is the wrong way round.
[[insn]]
mnemonic = "sei"
summary  = "enable interrupts"
operands = []
syntax   = ""
semantics = "ie = 1"

  [[insn.form]]
  encoding = "1010_1110"


[[insn]]
mnemonic = "cli"
summary  = "disable interrupts"
operands = []
syntax   = ""
semantics = "ie = 0"

  [[insn.form]]
  encoding = "1010_1111"


# --- the exception block: brk, halt, rti ------------------------------------
# THE THREE LOWEST OPCODES ARE THE THREE EXCEPTION INSTRUCTIONS - enter one,
# wait for one, return from one - and they are at 0x00, 0x01 and 0x02 for the
# reason halt used to be at zero on its own.  Erased memory, an unwritten ROM
# and a wild jump into a zeroed page all land on 0x00, and the useful thing for
# the machine to do there is stop in a way somebody can find afterwards.
#
# BRK IS STRICTLY BETTER AT ZERO THAN HALT WAS.  A halt at the point of the
# mistake leaves the pc sitting on the instruction that was wrong, which is
# already far better than a nop sled - but it stops the machine dead and the
# only way to learn anything is to attach something to the bus.  brk traps to
# the handler with the faulting address in lr, so a monitor can print it.  The
# sled argument that put halt at zero is unchanged and now buys more.
#
# NOP IS STILL AT THE FAR END, at 0x87, which is the same argument run the other
# way: the low opcodes are what a mistake lands on, so they hold the three
# instructions that stop or divert, and nop sits as far from them as the block
# reaches.  A nop sled through erased memory produces a machine that looks alive
# while executing nothing, which is the harder failure to diagnose of the two.
#
# THEY ARE ALL IN THE ONE-BYTE REGION ALREADY, and that is not a coincidence
# worth ignoring: `(op & 0x78) == 0` is the one-byte test, and 0x00, 0x01 and
# 0x02 all satisfy it.  So three new one-byte instructions cost the length
# decode nothing at all.  See the control row for what `sei` and `cli` cost it
# instead, which is not nothing.
#
# WHY THESE THREE WRITE THE PC FROM OUTSIDE 1010_xxxx.  The control row's rule
# is about PROGRAM control flow - the transfers a compiler emits, a disassembler
# follows and a decoder predicts.  An exception is not that: it is not reached
# from the instruction stream and its destination is not in the instruction.
# So the row keeps its meaning and these keep theirs, and the map is read as
# `1010_xxxx is every branch, jump, call and return` rather than as a claim
# about the pc that now has three exceptions.
#
# ----------------------------------------------------------------------------
# brk                                                                  1 byte
# ----------------------------------------------------------------------------
# A SOFTWARE INTERRUPT, and it takes the same path as a hardware one: the same
# microcode routine, the same shadow registers, the same vector.  What differs
# is only that it is reached by executing an opcode rather than by a pin, and
# so it is NOT maskable - `ie` gates the pin and nothing else.  A syscall that
# could be ignored because the caller happened to be inside a critical section
# would be useless.
#
# IT RESUMES AFTER ITSELF, where a hardware interrupt restarts the instruction
# it preempted.  `pc` is advanced before the semantics run - see the semantics
# section at the top of this file - so `lr = pc` saves the address FOLLOWING the
# brk, and `rti` returns there.  That is what a syscall wants.  The hardware
# path saves the address of the instruction that had not started yet, so that
# one is restarted instead; both are `lr = pc` and the difference is entirely in
# which cycle the interrupt is taken in.
[[insn]]
mnemonic = "brk"
summary  = "software interrupt: enter the handler"
operands = []
syntax   = ""
semantics = "shadow_lr = lr; lr = pc; shadow_sp = sp; sp = shadow_isp; ie = 0; pc = vector"

  [[insn.form]]
  encoding = "0000_0000"


# ----------------------------------------------------------------------------
# halt                                                                 1 byte
# ----------------------------------------------------------------------------
# STOP UNTIL AN INTERRUPT, and with interrupts disabled that is stop forever -
# which is the old halt, unchanged, and is what a wild jump still finds.  The
# two behaviours are one instruction because `ie` already distinguishes them.
#
# IT RESUMES AFTER ITSELF, like the 65C02's WAI.  Dispatching the halt consumes
# its opcode, so the pc is already past it while the machine waits, and the
# interrupt saves the address FOLLOWING the halt in lr - as brk does, and for
# the same reason: `pc` is advanced before the semantics run.  An `rti` goes on
# from there.
#
# SO THE POLICY IS THE IDLE LOOP'S.  One that wants to keep sleeping through
# an interrupt says so, in two bytes: `idle: halt` and then `br idle`, or a
# test of whatever the handler left behind before branching back.  Making the
# interrupt save the halt's own address instead, so that rti waited again,
# would need the pc less one on the path that saves it: a decrementer, a mux
# and a flop to say the entry came from a halt.
[[insn]]
mnemonic = "halt"
summary  = "stop the machine until an interrupt"
operands = []
syntax   = ""
semantics = "halted = 1"

  [[insn.form]]
  encoding = "0000_0001"


# ----------------------------------------------------------------------------
# rti                                                                  1 byte
# ----------------------------------------------------------------------------
# THE EXACT INVERSE OF THE ENTRY, statement for statement, which is what makes
# the pair safe to reason about.  Note that it is not a swap in either
# direction: there are TWO shadow stack pointers, and each move is one way.
#
# `sp` AND `shadow_isp` ARE NEVER EXCHANGED IN ONE CYCLE, and that is the whole
# reason there are two shadows rather than one.  A swap needs the old value of
# each side while the new one arrives, which on this machine means a mux in
# front of the register file's write port - measured at 3.3 MHz, see the byte-serial core's cpu.sv,
# and paid by every instruction rather than by the two that need it.  Two
# one-way moves in two cycles cost the datapath nothing and the exception a
# cycle, and the exception is where a cycle is affordable.
#
# IT IS ALSO THE BOOT SEQUENCE.  With interrupts disabled at reset, the stub
#
#       mov lr, #user_entry_point
#       mov sp, #interrupt_stack_base
#       rti
#
# loads the interrupt stack into `shadow_isp` on its way past and lands on
# user_entry_point with interrupts on - seven bytes, and both stack pointers
# are then set up.  The garbage it leaves in sp is overwritten by the first
# thing user_entry_point does, and an interrupt arriving in that window is
# harmless because it swaps sp away before the handler can touch it.
[[insn]]
mnemonic = "rti"
summary  = "return from an interrupt"
operands = []
syntax   = ""
semantics = "pc = lr; lr = shadow_lr; shadow_isp = sp; sp = shadow_sp; ie = 1"

  [[insn.form]]
  encoding = "0000_0010"


[[insn]]
mnemonic = "nop"
summary  = "do nothing"
operands = []
syntax   = ""
semantics = ""

  [[insn.form]]
  encoding = "1000_0111"


# =============================================================================
# Aliases  (assembler-only; no opcodes, no encodings)
# =============================================================================

# --- sub --------------------------------------------------------------------
# There is no subtract opcode.  Subtraction reaches the hardware two different
# ways depending on what the second operand is, so `sub` is two aliases:
#
#   sub rd, ra, rb    ->  rsb rd, rb, ra     sources swapped
#   sub rd, ra, #imm  ->  add rd, ra, #-imm  immediate negated
#
# Neither `sub` alias sets `prefer`, so neither names a cell of the opcode map.
# Preferring the register one would erase `rsb` from the map, since every rsb
# is some sub with its sources swapped; preferring the immediate one would
# label every add of a negative constant a subtract.  Both are arguable as
# taste and neither is clearly an improvement.  Listings are unaffected either
# way: no disassembler prints an alias, so they show the instruction that
# actually ran whatever this flag says.
#
# WATCH THE IMMEDIATE CASE.  Negation happens before form selection, so the
# form chosen depends on -imm, not imm, and the imm3 table is lopsided: it
# holds seven non-negative values and only one negative.  `add rd, ra, #4` is
# two bytes; `sub rd, ra, #4` becomes `add rd, ra, #-4`, which is not in the
# table and falls all the way to the three-byte imm10 form.
#
# The tied form rescues the common case: `sub rd, rd, #4` negates to -4, which
# fits imm5's -16..+15, so decrementing a register in place stays two bytes.
# It is specifically subtracting a small constant into a DIFFERENT register
# that costs three.
#
# If subtracting small constants into a DIFFERENT register turns out to be
# common, the fix is another form or a wider table - not a sub opcode, and not
# a reshuffle of imm3.  That table has no slack: -1, 1 and 3 are there to
# absorb pointer tags and 0, 2, 4, 6, 8 are their untagged counterparts, so
# there is no slot going spare to spend on -4.

[[alias]]
mnemonic = "sub"
summary  = "rd = ra - rb"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{d}, {a}, {b}"
expand   = { mnemonic = "rsb", args = { d = "d", a = "b", b = "a" } }

# --- mov (register to register) ---------------------------------------------
# There is no register-to-register move opcode.  `or rd, rs, #0` is a copy, and
# 0 is in the imm3 table, so the two-register form is two bytes for free.  When
# the registers are r0 and r1 the pinned one-byte forms on `or` take over, so
# `mov r0, r1` costs a single byte - all without a mov opcode existing.
#
# This is two mechanisms composing: the alias rewrites to `or`, and then
# shortest-first form selection finds the implicit encoding.  Neither knows
# about the other.
[[alias]]
mnemonic = "mov"
summary  = "rd = rs"
operands = [
  { name = "d", type = "reg" },
  { name = "s", type = "reg" },
]
syntax   = "{d}, {s}"
expand   = { mnemonic = "or", args = { d = "d", a = "s", imm = 0 } }
prefer   = true


[[alias]]
mnemonic = "sub"
summary  = "rd = ra - immediate"
operands = [
  { name = "d",   type = "reg"   },
  { name = "a",   type = "reg"   },
  { name = "imm", type = "int16" },
]
syntax   = "{d}, {a}, #{imm}"
expand   = { mnemonic = "add", args = { d = "d", a = "a", imm = "-imm" } }


# --- the zero-offset shorthand ----------------------------------------------
# `ld rd, [ra]` for `ld rd, [ra, #0]`, and the same for ld8, st and st8.
#
# Pure notation: the offset is a required field of the encoding and there is no
# separate register-indirect opcode, so this saves nothing but typing.  It is
# here rather than in the assembler because the spec is what defines the
# assembly language - the same reason `mov` and `sub` are aliases and not
# generator policy.
#
# NOT PREFERRED, deliberately.  A disassembly that prints `ld r0, [r1]` hides
# the fact that an offset field was encoded, and a listing read next to a hex
# dump should show every field the bytes carry.  So the canonical form keeps
# the `#0` and only source may drop it, which also leaves round-tripping alone:
# decode always emits `#0`, and `#0` always re-assembles.
#
# The four blocks are identical apart from the mnemonic and the load/store
# operand name.  There is no way to say that once - an alias names exactly one
# target - and the check in tools/check.js verifies each rewrite lands on a
# real entry, so a drifting copy is caught rather than silently ignored.

[[alias]]
mnemonic = "ld"
summary  = "rd = memory16[ra]"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
]
syntax   = "{d}, [{a}]"
expand   = { mnemonic = "ld", args = { d = "d", a = "a", off = 0 } }

[[alias]]
mnemonic = "ld8"
summary  = "rd = memory8[ra], zero extended"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
]
syntax   = "{d}, [{a}]"
expand   = { mnemonic = "ld8", args = { d = "d", a = "a", off = 0 } }

[[alias]]
mnemonic = "st"
summary  = "memory16[ra] = rs"
operands = [
  { name = "s", type = "reg" },
  { name = "a", type = "reg" },
]
syntax   = "{s}, [{a}]"
expand   = { mnemonic = "st", args = { s = "s", a = "a", off = 0 } }

[[alias]]
mnemonic = "st8"
summary  = "memory8[ra] = rs"
operands = [
  { name = "s", type = "reg" },
  { name = "a", type = "reg" },
]
syntax   = "{s}, [{a}]"
expand   = { mnemonic = "st8", args = { s = "s", a = "a", off = 0 } }
