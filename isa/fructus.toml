# =============================================================================
# Fructus - a 16-bit retrocomputer instruction set.
#
# This file is the single source of truth for the encoding.  The assembler,
# the disassembler and the simulator are all generated from / driven by it, so
# they cannot drift apart.
#
# ---------------------------------------------------------------------------
# HOW TO READ AN ENCODING
# ---------------------------------------------------------------------------
# An `encoding` is a bit map written most-significant-bit first, byte 0 first.
#   `0` / `1`  a fixed opcode bit
#   a letter   one bit of an operand field
#   `_` / ` `  ignored, purely for readability
#
# By default a letter binds to the operand whose name starts with that letter,
# and its bits are gathered most-significant first in the order they appear.
# With operands `d`, `a` and `off`, the letters are `d`, `a` and `o`.
#
# A form's `fields` map overrides that default:
#
#   fields = { o = "off:imm5" }        letter `o` carries operand `off`,
#                                      encoded as type imm5
#
#   fields = { i = "off:imm3[0]",      operand `off` is SPLIT: letter `i`
#              j = "off:imm3[2:1]" }   carries its bit 0, letter `j` carries
#                                      bits 2 then 1
#
# The `[..]` selector is needed whenever a field's bits are not in descending
# significance across the instruction as a whole - which is exactly what
# happens when a field bleeds into the low bits of the opcode byte.
#
# ---------------------------------------------------------------------------
# LOGICAL TYPE vs ENCODED TYPE
# ---------------------------------------------------------------------------
# An operand's `type` is its LOGICAL domain - what a programmer is allowed to
# write.  A form may encode it far more narrowly.  `ld8`'s displacement is
# logically a signed 16-bit `disp`; one form squeezes it into a signed 5-bit
# field and another into a 3-bit table index.  The assembler's job is to pick a
# form whose encoding can actually represent the value that was written.
#
# ---------------------------------------------------------------------------
# HOW ONE INSTRUCTION HAS SEVERAL ENCODINGS
# ---------------------------------------------------------------------------
# An instruction declares its operands and its assembly syntax ONCE.  It then
# declares one or more `[[insn.form]]` encodings.  A form may pin operands that
# do not appear in its bit map:
#
#   fix = { d = 0 }        operand `d` is implicitly 0 in this form
#   tie = { d = "a" }      operand `d` shares the bits of operand `a`
#
# Every operand must be determined by every form - as a field in the bit map,
# by `fix`, or by `tie` to something itself determined.  A validator should
# reject a form where that is not true.
#
# Two `[[insn]]` blocks may share a mnemonic when the operands differ in KIND
# rather than merely in encoding.  `add rd, ra, rb` and `add rd, ra, #imm` put
# a register and an immediate in the same slot, which no single operand list
# can describe, so they are separate entries with separate syntax.  The
# assembler tries each in turn, and the `#` in the source is what tells them
# apart.
#
# The assembler picks the *first form whose constraints the operands satisfy*,
# with forms tried shortest-first, so `ld8 r0, [r0, #0]` automatically becomes
# the one-byte encoding while `ld8 r3, [r3, #-2]` becomes the two-byte one.
# The disassembler prints both through the same syntax template, so text ->
# bytes -> text round-trips.
#
# ---------------------------------------------------------------------------
# WHAT AN INSTRUCTION DOES: THE `semantics` FIELD
# ---------------------------------------------------------------------------
# Every [[insn]] carries one, and tools/sim.js executes it.  The language is
# deliberately tiny - statements separated by `;`, one `if`, no loops, no
# locals, no calls but a fixed set of builtins:
#
#   R[n]              the register file          M8[a]   one byte of memory
#   sp, lr            register aliases, by name  M16[a]  one 16-bit word,
#   pc                see below                          in `endian` order
#   halted            set by `halt`
#
#   ie                the interrupt-enable flag, set by `sei` and cleared by
#                     `cli`.  Write-only: nothing reads it back.
#   shadow_sp         where an exception parks the interrupted code's sp
#   shadow_isp        where regular code parks the INTERRUPT stack pointer
#   shadow_lr         where an exception parks the interrupted code's lr
#   vector            the address an exception enters at, [cpu] interrupt_vector
#
# THE THREE SHADOWS ARE MACHINE STATE AND NOT REGISTERS.  No instruction names
# them as an operand and nothing in the register file reaches them; they exist
# because `brk` and `rti` move values through them, which is the only way their
# contents can be observed at all.  They are named here rather than hidden
# inside the two instructions so that the semantics of an exception are written
# out the same way every other instruction's are.
#
#   sxt8              extend from 8 bits         clz bitrev popcount
#   shl lsr asr       shift by a count           test(cond, x, y, width)
#
# Operand names are in scope as themselves, already decoded: `off` is the
# signed displacement the programmer wrote, not the bits that carried it, and a
# `combo` operand's parts are reached as `k.cond` and `k.imm`.
#
# EVERYTHING IS 16 BITS ON THE WAY IN AND OUT.  Intermediate arithmetic is
# exact; assigning to R[], M8[] or M16[] truncates.  So `R[d] = R[a] + R[b]`
# wraps because the destination is 16 bits wide, which is also why the hardware
# wraps, rather than because a wrap was written down.
#
# `pc` IS THE ADDRESS OF THE NEXT INSTRUCTION.  It is advanced before the
# semantics run, which is what lets `call` be `lr = pc; pc = t` and a branch be
# `pc = pc + off` with no adjustment term in either.  It also means the pcrel
# displacements are relative to the next instruction because the semantics say
# so, and not by a separate convention a reader has to remember.
#
# MASKING THAT IS ARCHITECTURAL IS WRITTEN OUT.  A shift reads only the low four
# bits of its count, so the semantics say `shl(R[a], R[b] & 15)` rather than
# hiding the mask inside `shl`.  The reader should be able to see every place
# the hardware ignores bits it was given.
#
# NOT JAVASCRIPT, ON PURPOSE.  Evaluating these as JS would have been free and
# would have worked immediately.  The spec is meant to drive a hardware
# description as well as a simulator, and semantics written in JS can only ever
# drive JavaScript.  Everything above has an obvious translation to C and a
# fairly obvious one to Verilog.
#
# ---------------------------------------------------------------------------
# OPERAND TYPE KINDS
# ---------------------------------------------------------------------------
#   int     a number, `bits` wide, `signed` or not.  `wrap` additionally
#           accepts the unsigned spelling of the same pattern.
#   reg     the register file: `names`, plus `aliases` for extra spellings.
#   table   the field holds an INDEX into `values`; "fits" means "is in the
#           table".  Exactly 2^bits entries, all distinct.
#   enum    the field holds an index into `names`.  `aliases` gives extra
#           spellings; `swapped` gives spellings reached by EXCHANGING two
#           operands of the instruction, which is how eight encoded branch
#           conditions accept twelve written ones.  An instruction that allows
#           this declares the exchangeable pair with `swap_operands`.
#   combo   one field carrying SEVERAL values at once.  `parts` names them and
#           each entry of `values` supplies one per part.  A syntax template
#           reaches them as `{k.cond}`, `{k.imm}` for an operand named `k`, so
#           a single field parses and prints as two operands.  `values` may be
#           shorter than 2^bits while a table is still being designed.
#
# `fix` takes a name for reg, enum and combo operands, and a number otherwise.
#
# ---------------------------------------------------------------------------
# ALIASES
# ---------------------------------------------------------------------------
# An `[[alias]]` is assembler-only sugar: a mnemonic the assembler accepts and
# rewrites into a real instruction before encoding.  It has no encoding of its
# own, consumes no opcode, and is invisible to the invariants below.
#
# The rewrite names a target mnemonic and maps its arguments by name.  A STRING
# names one of the alias's own operands, optionally negated; an INTEGER is a
# literal constant:
#
#   expand = { mnemonic = "rsb", args = { d = "d", a = "b", b = "a" } }
#   expand = { mnemonic = "add", args = { d = "d", a = "a", imm = "-imm" } }
#   expand = { mnemonic = "or",  args = { d = "d", a = "s", imm = 0 } }
#
# A mnemonic may be shared between an `[[insn]]` and an `[[alias]]` in exactly
# the way two `[[insn]]` entries may share one - `mov rd, #imm` is a real
# instruction and `mov rd, rs` is an alias onto `or`.
#
# NO DISASSEMBLER PRINTS AN ALIAS.  Both of them - binutils' and the one in
# tools/decode.js - print the instruction that was actually encoded, so
# `sub r1, r2, r3` comes back as `rsb r1, r3, r2` and `mov r0, r1` comes back
# as `or r0, r1, #0`.  Round-trip tests must compare against the rewritten
# text.
#
# `prefer = true` NAMES THE SPELLING THE OPCODE MAP USES, and nothing else.
# tools/gen-opcode-map.js runs the rewrite backwards to label a cell, so the
# map reads `mov rd, rs` where a listing of the same bytes reads `or`.
#
# IT WAS ONCE SPECIFIED AS DISASSEMBLER BEHAVIOUR AND NEVER IMPLEMENTED THERE,
# which is worth recording rather than quietly correcting: the two
# disassemblers agreed with each other and only the prose disagreed, so
# tests/dis-check.mjs - which compares them operand by operand - stayed green
# throughout.  Nothing in this suite compares a tool against a paragraph, and
# this is what that gap looks like.
#
# A preferred alias must still be INVERTIBLE: every rewrite argument is either
# a literal or a distinct operand of the alias, and every operand of the alias
# is used exactly once, or the rewrite cannot be run backwards.  tools/check.js
# enforces it.  Where several preferred aliases match, the first in file order
# wins.
#
# ---------------------------------------------------------------------------
# INVARIANTS A VALIDATOR SHOULD ENFORCE
# ---------------------------------------------------------------------------
#  1. Every encoding is a whole number of bytes.
#  2. The bits a form devotes to an operand - summed over every letter that
#     carries it - exactly cover that operand's encoded type, each bit once.
#     A split field must name every bit and no bit twice.
#  3. Every operand of an instruction is determined by every one of its forms.
#  4. Every `fix` value is representable in the operand's encoded type.
#  4a. A `table` type's `values` are distinct, so that the assembler's reverse
#     lookup from written value to field index is unambiguous.
#  5. LENGTH IS DETERMINED BY BYTE 0: all forms that can match a given first
#     byte have the same total length.
#  6. NO TWO FORMS OVERLAP: for any two forms A and B,
#     (A.match ^ B.match) & (A.mask & B.mask) != 0.
#     This is the check that keeps an evolving opcode map honest - run it on
#     every build.
# =============================================================================


[cpu]
name       = "fructus"
word_bits  = 16          # register and ALU width
addr_bits  = 16          # 64 KiB address space
byte_bits  = 8
endian     = "little"    # byte order of 16-bit values in *data* memory
                         # (instruction bytes are always stored in the order
                         # they are written in `encoding`, byte 0 lowest)

# DESIGN RULE.  Instructions are byte-granular and variable length, and the
# length of an instruction is determined entirely by its FIRST BYTE.  The fetch
# unit therefore never has to look ahead or backtrack, and the whole decoder is
# a 256-entry table indexed by byte 0.  This is a real commitment about the
# shape of the opcode map, not just a lint - invariant 5 above enforces it, and
# it will reject an otherwise reasonable encoding that violates it.
length_from_first_byte = true

# Where an exception enters is [cpu.vectors], at the end of this section.

# =============================================================================
# THE COST MODEL
# =============================================================================
# The bus is 6502-like: one cycle carries one byte, and it carries instruction
# fetch and data alike.  So an instruction costs the bytes it occupies plus the
# bytes it moves, and tools/sim.js counts exactly that.
#
# WITH ONE EXCEPTION, and it is not a rounding error.  A relative branch that is
# TAKEN costs one cycle more than its length, because the target is pc + off and
# the adder cannot produce it until the displacement byte has arrived.  There is
# nothing to fetch during that cycle.  The 6502 charges the same: a branch is
# two bytes and two cycles when it falls through, three when it is taken.
#
# AND A ONE-BYTE INSTRUCTION THAT COMPUTES COSTS TWO CYCLES, which is the price
# of the pipelining rather than of the encoding.  The hardware reads its
# operands in the cycle BEFORE the ALU sees them - see the byte-serial core's cpu.sv - and every
# multi-byte instruction has a fetch cycle to do that in.  A one-byte form has
# no second byte, so it spends a cycle of its own.  It keeps its size, which is
# what it was for: `add r0, r0, #1` is still one byte where the general form is
# two, and a program of them is still half the size.
#
# nop and halt are not in this: they read nothing and compute nothing.  The
# alternative was to forward the result being written into the operands, which
# is a mux in front of the ALU and measured a fifth of the clock - so the
# machine charges the rare instruction rather than slowing every other one.
#
# AND A TRANSFER WHOSE TARGET IS A REGISTER COSTS THREE CYCLES, whatever its
# length.  The register has to be READ before it can be an address, and the
# read takes a cycle of its own: one to read it, one to present it, and one for
# the target's own opcode to arrive on the bus.  So `ret` is one byte and three
# cycles, and `jmp ra` and `call ra` are two bytes and three cycles - the only
# instructions in the machine that cost more than a cycle a byte for a reason
# that is not a branch being taken.
#
# THAT IS WHY `jmp ra` IS NOT ONE BYTE.  It was, pinned to r5, and the byte it
# saved bought nothing the pin did not take back: an indirect jump through the
# one register the assembler may clobber is a jump you have to arrange for.
# Two bytes and any register is the same three cycles.
#
# AND A MEMORY ACCESS COSTS ONE CYCLE MORE THAN ITS BYTES AND THE BYTES IT
# MOVES, for the add that produces the address.  This is the taken branch's
# cycle over again and it is the same argument: the operands are read a cycle
# BEFORE they are used, so `R[a] + off` cannot reach the address bus until the
# cycle after the instruction's last byte arrived, and there is nothing to
# fetch while the adder runs.  So `ld r1, [r2, #4]` is two bytes, two data
# bytes and five cycles.
#
# THE ALTERNATIVE WAS MEASURED AND IS WORSE.  Adding the address in the same
# cycle its last byte arrives - out of the register file, through immgen and an
# adder, into the memory's address pins - costs no cycles at all, and costs a
# third of the clock, because that is the exact path the early operand read was
# introduced to remove.  MEASURED on an iCE40 UP5K with a real SB_SPRAM256KA on
# the bus, medians of eight placement seeds: 28.95 MHz with the address a cycle
# later, as here, against 20.54 with it added in the fetch cycle - the same
# 1141 cells in both, so what is bought is the path and not the hardware.  One cycle on
# the accesses against a third off every instruction in the machine is not a
# close call; the byte-serial core's cpu.sv carries the rest of the numbers.
#
# AND `pop` PAYS ONE CYCLE MORE STILL, because its last act is to write sp and
# the register file has ONE write port, so that write cannot share the cycle
# that writes the last popped register.  `push` has no such conflict: its sp
# write lands in the cycle the next opcode is dispatched in, which is where
# every other instruction's result lands too.
#
# AND AN INSTRUCTION MAY DECLARE EXTRA CYCLES, with `extra_cycles` on its entry,
# when the hardware takes its result a cycle after its bytes are in.  clz and
# popcount do: their logic is registered halfway through, which is what keeps
# them from setting the clock every other instruction runs at.  tools/sim.js
# adds the extra cycles to its count.
#
# AN ABSOLUTE JUMP PAYS NOTHING, for the same reason in reverse.  `jmp target`
# and `call target` carry the new pc as immediate bytes, so they are latched as
# they are fetched and no addition happens; `ret` and `call ra` read the pc from
# the register file, which is available at once.  Again this is the 6502's
# behaviour, where JMP absolute is three bytes and exactly three cycles.
#
# The simulator does not need a list of which instructions are which - the
# semantics already say.  `pc = pc + off` mentions pc on the right and is
# therefore relative; `pc = target` and `pc = lr` do not and are absolute.
taken_branch_penalty = 1


# =============================================================================
# THE VECTORS
# =============================================================================
# Where an exception enters.  Each of these is an ADDRESS THE MACHINE JUMPS TO,
# and not a pointer it reads.
#
# THAT IS THE DEPARTURE FROM THE 6502, whose layout the microtan hardware used
# to borrow.  A jump is one internal register write and no bus cycle at all; an
# indirect vector is an address cycle and two data cycles at the front of EVERY
# exception.  The indirection earns its keep on a 6502 because that part has no
# instruction that can sit at a fixed address and reach anywhere - so the vector
# has to be data.  This machine has `jmp target`, so the slot can simply BE the
# jump and the hardware needs to know nothing but an address.
#
# THEY ARE AT THE TOP OF MEMORY, WHICH IS TRADITIONALLY ROM.  The bottom of the
# address space is where globals and the stack live, so a vector down there has
# to be carved out of space a program is already using - which is exactly what
# makes a low vector collide with a flat image linked from zero.  The top is the
# part an exception can rely on being non-volatile.
#
# FOUR BYTES APART, DESCENDING.  Four is what `jmp target` costs plus one, so
# every slot holds a jump to anywhere in the address space with a byte to spare;
# and four is a power of two, so picking the nth vector is a shift rather than a
# multiply, which matters to whatever decodes an interrupt line into a slot.
#
# ONE VECTOR PER REASON, RATHER THAN ONE ENTRY POINT AND A STATUS REGISTER.  The
# handler knows why it was entered from the address it was entered at, before it
# has executed an instruction - so a trap handler and a timer handler share no
# code and no dispatch.  The alternative needs a readable cause register, and
# this machine deliberately has no way to read even the interrupt-enable flag.
#
# MOST OF THESE ARE RESERVED AND NOTHING IMPLEMENTS THEM YET.  They are written
# down now so the addresses cannot be claimed by something else later, and so
# that the spacing is fixed while it is still free to fix.
[cpu.vectors]
reset        = 0xfffc   # the board's, not the bare part's: reset presents 0
brk          = 0xfff8   # IMPLEMENTED: `brk`, and the hardware interrupt line
illegal_insn = 0xfff4   # reserved: an opcode the processor does not implement
nmi          = 0xfff0   # reserved
irq7         = 0xffec   # reserved: hardware interrupt lines, 7 down to 0
irq6         = 0xffe8
irq5         = 0xffe4
irq4         = 0xffe0
irq3         = 0xffdc
irq2         = 0xffd8
irq1         = 0xffd4
irq0         = 0xffd0


# =============================================================================
# Object format
# =============================================================================
# What a binutils port has to agree with the rest of the world about.  None of
# this is used yet - there is no gas or bfd port - but both of these are values
# that several files must hold identically, which is what this file is for.

# THE ELF MACHINE NUMBER.  e_machine is `unsigned char e_machine[2]` - SIXTEEN
# BITS - and nothing in the toolchain range-checks a value assigned to it: a
# wider constant is written through bfd_put_16 and silently loses its top bits,
# leaving a header that disagrees with every object it produces.  check.js
# asserts the width for that reason, and asserts non-collision against the real
# include/elf/common.h in vendor/binutils-gdb rather than a copy that goes stale.
#
# 0xfc75 is unofficial.  include/elf/common.h asks that new unofficial values be
# large random numbers, because generic mnemonics converge - 0xdead, 0xbeef,
# 0xf00d and 0xfeed are all taken, and MN10200 and MN10300 burned two of them
# between them.  FC75 reads as FCTS, a contraction of Fructus, which has the
# opposite property: colliding needs another project with this project's name.
# Nothing within 512 of it is claimed.  The expectation, as the header says, is
# that a maintained target eventually asks the registry for a blessed number.
[elf]
machine    = 0xfc75          # EM_FRUCTUS, unofficial
machine_id = "EM_FRUCTUS"
class      = 32              # ELFCLASS32: the CONTAINER is elf32, the addresses
                             # are 16-bit.  msp430 is 16-bit and uses
                             # elf32-msp430.c the same way; pdp11 is a.out and is
                             # not the model to copy.
max_page   = 4               # no MMU, so do not align sections to 4 KiB and
                             # spend most of a 64 KiB address space on padding

# THE RELOCATIONS, all four of them generic.  Every address in a Fructus program
# is one of three things, so the port needs no relocation of its own:
#
#   pcrel = true   the field holds a displacement from the address of the NEXT
#                  instruction, not from the field's own address.  Getting that
#                  bias wrong produces branches off by the instruction length,
#                  which assembles clean and fails at run time - the assembler
#                  already encodes it as `rel_off = off - $ - <nbytes>`.
#   signed = true  a displacement out of range is a link-time error, not a
#                  silent wrap.  In bfd terms complain_overflow_signed.
[[reloc]]
name   = "BFD_RELOC_8_PCREL"
bits   = 8
pcrel  = true
signed = true
used_by = "br, brclr, brset, jmpr rel8 - the off8 displacement"

[[reloc]]
name   = "BFD_RELOC_16_PCREL"
bits   = 16
pcrel  = true
signed = true
used_by = "jmp and call, whose targets are absolute"

[[reloc]]
name   = "BFD_RELOC_16"
bits   = 16
pcrel  = false
signed = false
used_by = "jmp abs16, call abs16, mov rd #imm16, and the dw directive"

[[reloc]]
name   = "BFD_RELOC_8"
bits   = 8
pcrel  = false
signed = false
used_by = "the #d8 directive"


# =============================================================================
# Operand types
# =============================================================================

# The register file.  Eight 16-bit registers.
[optype.reg]
kind  = "reg"
bits  = 3
names = ["r0", "r1", "r2", "r3", "r4", "r5", "r6", "r7"]
# Extra spellings the assembler accepts for the same register numbers.
aliases = { sp = "r6", lr = "r7" }
# Which spelling the disassembler emits: "names" or "aliases".
# Flip to "aliases" if you would rather read `sp` and `lr` in listings.
print = "names"

# The logical domain of any written signed value - a memory displacement, an
# ALU immediate.  No form encodes all of it; `int16` is what the programmer may
# WRITE, and the forms below narrow it to imm5, imm3 or imm10.  Intent is
# carried by the operand's NAME (`off`, `imm`), not by having several identical
# logical types.
[optype.int16]
kind   = "int"
bits   = 16
signed = true
# `wrap` accepts either spelling of a 16-bit pattern - -32768..32767 and
# 0..65535 both - and takes the value modulo 2^16.  A register is 16 bits, so
# #-1 and #0xffff are the same thing and rejecting either would only be
# annoying.  This is what makes `and rd, ra, #0xff00` work: it wraps to -256,
# which is inside imm10's range.
wrap = true

# Signed 5-bit displacement, -16..+15.  Used by the ld8/st8 address forms.
[optype.imm5]
kind   = "int"
bits   = 5
signed = true

# Signed 10-bit displacement, -512..+511.  Wide enough that the assembler
# essentially never has to refuse a displacement, at the cost of a third byte.
[optype.imm10]
kind   = "int"
bits   = 10
signed = true

# One bit: does an 8-bit pop sign extend, or zero extend?
[optype.sxflag]
kind   = "int"
bits   = 1
signed = false

# Signed 8-bit branch displacement, relative to the address of the NEXT
# instruction.  Operands using it are marked `pcrel`, so the programmer writes
# an absolute label and the assembler encodes the difference.
[optype.off8]
kind   = "int"
bits   = 8
signed = true

# Single-bit masks and their complements.  Four bits choose a bit position and
# the fifth inverts, so the 32 entries are 1<<n for n = 0..15 followed by the
# sixteen ~(1<<n).  Five bits, 32 distinct 16-bit constants, no gaps.
#
# This started life as brset and brclr's 4-bit index.  A 16-bit word needs
# only four bits to name a bit, brset and brclr used the fifth to say which
# of the two they were - and that made the whole field a 1<<n generator that
# only two instructions could reach.  Promoting it to an operand type spends
# the fifth bit on inversion instead and hands the generator to the ALU:
#
#     and rd, rd, #~(1<<n)     clear a bit
#     or  rd, rd, #1<<n        set a bit
#     mov rd, #1<<n            any single-bit constant, in two bytes
#
# The hardware is a 4-to-16 decoder and sixteen XOR gates on the invert bit,
# which is the cheapest 5-bit window onto the 16-bit constants that exists -
# and it is already built, because brset needed it.  It is built as a one-hot
# nibble shifted by four times bits 3:2, which is the shifter immask5 below
# shares; see there.
#
# The complements are not padding.  `and rd, rd, #0x7fff` clears the sign bit,
# which is the renormalisation step in every floating-point routine in
# snippets/, and 0x7fff is the largest positive 16-bit value.
#
# Note what is NOT here: 0, -1, and everything with two or more bits set.  Those
# still come from imm5, imm3 and imm10, which is why this is an ADDITION to the
# ALU groups and not a replacement for one.  Where the two overlap - 1, 2, 4, 8
# and -2, -3, -5, -9 are in imm5's range too - the assembler prefers the form
# listed first and drops the duplicate entries here, so nothing is ambiguous.
[optype.immbit5]
kind   = "table"
bits   = 5
values = [
  0x0001, 0x0002, 0x0004, 0x0008, 0x0010, 0x0020, 0x0040, 0x0080,
  0x0100, 0x0200, 0x0400, 0x0800, 0x1000, 0x2000, 0x4000, 0x8000,
  0xfffe, 0xfffd, 0xfffb, 0xfff7, 0xffef, 0xffdf, 0xffbf, 0xff7f,
  0xfeff, 0xfdff, 0xfbff, 0xf7ff, 0xefff, 0xdfff, 0xbfff, 0x7fff,
]

# FIELDS AND STRIPES, and their complements.  immbit5 reaches one bit at a
# time; this reaches the shapes a bit FIELD has - a pair, a nibble, a byte -
# and the swizzle masks a bit-twiddling routine needs.
#
#   0x3 << 2n   eight aligned 2-bit fields.  Tagged pointers use the low bits
#               and small enums live in pairs, so these are the masks that
#               extract and clear them.
#   0xf << 4n   the four nibbles.
#   0xff00      the high byte.  Its complement 0x00ff is the low byte, which
#               is why that one is not listed separately.
#   f0f0 cccc aaaa
#               the swizzle masks, and their complements 0f0f 3333 5555.
#
# THE COMPLEMENTS ARE HALF THE POINT.  `and rd, rd, #~mask` clears a field
# where `and rd, rd, #mask` keeps it, and both are two bytes.
#
# AND THE SET IS EXACTLY WHAT SWAR NEEDS.  5555 3333 0f0f 00ff and their
# complements aaaa cccc f0f0 ff00 are all present, which is the whole mask
# sequence a software popcount or bit reversal walks.
#
# THE ORDER IS THE HARDWARE'S, and it is the order of immbit5.  Bits 3:2 of the
# index are a row and bits 1:0 a column, and every entry but one column is a
# nibble pattern shifted left by four times the row - exactly as immbit5's 1<<n
# is 1<<column shifted by four times the row:
#
#     column          0        1        2        3
#     nibble          f        3        -        c
#     row 0        000f     0003     ff00     000c
#     row 1        00f0     0030     f0f0     00c0
#     row 2        0f00     0300     cccc     0c00
#     row 3        f000     3000     aaaa     c000
#
# So the two tables are ONE circuit: four LUT4s make the nibble from the column
# and the mask-or-bit column of the opcode, one shift by 0, 4, 8 or 12 places it,
# column 2 overrides the result with its row's byte or swizzle mask, and the
# top index bit complements the lot.  The unused column-2 nibble is a
# don't-care the override pays for.
#
# MEASURED on an iCE40 UP5K, yosys 0.52 + nextpnr-ice40 0.7, beside the byte-serial core's rhs.sv
# and inside the processor, with the two mask columns of the opcode map at +4
# and +5 so that one opcode bit selects this whole block:
#
#                                                  LUT4 (rhs)   LUT4 (cpu)   MHz
#     two flat sixteen-entry tables, old order        176          947      23.7
#     this order, the shared shifter                  158          911      23.9
#       with every opcode moved to match              158          938      23.3
#
# The middle row changed only this block; the last is the processor as
# generated, where the byte-serial core's predecode.sv's table came out 13 LUT4 larger for rows
# that only moved.  The clock did not move - medians of eight seeds, all well
# inside what the seeds wander by - because the immediate settles before the
# register it competes with at the byte-serial core's rhs.sv's mux.  It is area.
#
# NONE OF THIS CONSTRAINED THE CONTENTS, which were chosen for the compiler;
# only their order is the circuit's.  tools/check.js says what an edit that
# breaks the pattern costs: a mask outside it needs column 2's override, and a
# second such column needs a table again.
[optype.immask5]
kind   = "table"
bits   = 5
values = [
  0x000f, 0x0003, 0xff00, 0x000c,
  0x00f0, 0x0030, 0xf0f0, 0x00c0,
  0x0f00, 0x0300, 0xcccc, 0x0c00,
  0xf000, 0x3000, 0xaaaa, 0xc000,
  0xfff0, 0xfffc, 0x00ff, 0xfff3,
  0xff0f, 0xffcf, 0x0f0f, 0xff3f,
  0xf0ff, 0xfcff, 0x3333, 0xf3ff,
  0x0fff, 0xcfff, 0x5555, 0x3fff,
]

# Branch conditions.  Three bits, eight encoded, twelve spellings accepted.
#
# The encoded eight are the four ordered comparisons - signed and unsigned, in
# their `<` and `<=` senses - plus equality both ways and overflow both ways.
# Reversing the two source registers turns each ordered comparison into its
# mirror, so `gt`, `ge`, `hi` and `hs` need no encoding of their own: they are
# `lt`, `le`, `lo` and `ls` with the operands exchanged.  An instruction that
# permits the exchange says so with `swap_operands`.
#
# THERE IS NO `al`.  An unconditional branch is a register compared for
# equality with itself, which is why the two-byte form at 0xa1 pins `eq, r0,
# r0` rather than spending a condition slot on "always".  `nv` is not encoded
# either - a branch that never happens is a nop the assembler can just not
# emit.  Both slots go to the overflow conditions instead.
#
# Against ARM's sixteen, only `mi` and `pl` are absent, and deliberately.  `mi`
# is N=1 while `lt` is N!=V: they differ only when the subtraction overflows,
# and in that case `lt` is the correct signed comparison and `mi` is the broken
# one.  Sign-testing a single value - `mi`'s real use - is `lt` against #0 in
# the condimm5 table, or `brset ra, #0x8000` on the sign bit directly.  Subtracting
# zero cannot overflow, so those are provably identical to `mi`.
[optype.cond3]
kind    = "enum"
bits    = 3
names   = ["lt", "lo", "le", "ls", "eq", "ne", "vs", "vc"]
aliases = { cc = "lo" }
swapped = { gt = "lt", ge = "le", hi = "lo", hs = "ls", cs = "ls" }

# FIVE BITS THAT CARRY A CONDITION AND A CONSTANT TOGETHER, so a compare against
# a small literal is one three-byte instruction rather than a load and a branch.
#
# THE ENTRIES ARE WRITTEN THE WAY A PROGRAMMER WRITES THEM - `br lt, ra, #4`
# means R[a] < 4 - and the hardware computes something else.  That gap is worth
# stating carefully, because it decides which 32 pairs are worth having.
#
# The register sits at byte1[2:0], the slot `rsb rd, rd, #imm` uses for ALU port
# A, and the constant reaches port B like every other immediate.  The ALU
# subtracts port A from port B, so what is actually computed is
#
#     imm - R[a]        and not      R[a] - imm
#
# with the flags of that subtraction.  Two consequences, and only two:
#
#   THE CONDITION IS MIRRORED.  Testing C on the flags of `imm - R[a]` answers
#   `imm C R[a]`, so answering `R[a] cond imm` means encoding mirror(cond) - lt
#   for gt, le for ge, and so on.  This costs nothing: cond3 already carries an
#   operand-order bit for exactly this, which is how twelve spellings fit into
#   eight encodings.  eq and ne are their own mirrors.
#
#   THERE IS NO `vs` HERE, and that is the second consequence rather than an
#   omission.  Overflow is not symmetric - overflow(x - k) and overflow(k - x)
#   differ at the two points where the true difference is exactly +/-32768 - so
#   a `vs` entry would be the one thing the mirror could not carry.  It could be
#   repaired exactly, since overflow(x - k) is overflow((k-1) - x) for every k,
#   but there is no need: THE OVERFLOW TESTS ARE ORDINARY COMPARISONS.
#
#       x++  overflows   <=>  x >= 32767      ge #32767
#       x+=2 overflows   <=>  x >= 32766      ge #32766
#       x--  underflows  <=>  x <  -32767     lt #-32767
#       x-=2 underflows  <=>  x <  -32766     lt #-32766
#
#   Four plain signed comparisons, mirroring like everything else, and one more
#   test than the three `vs` entries they replace.  `vs` stays in cond3 for the
#   two-register branch, where both operands are registers and the subtraction
#   is already the right way round.
#
#   WHO THESE ARE FOR, because it decides the step sizes.  Not C - signed
#   overflow is undefined there and a compiler will not ask.  These are for a
#   dynamic language runtime with unboxed small integers, checking whether an
#   increment has left fixnum range and has to box.  A bare fixnum steps by one,
#   so ++ and -- are the tests; a fixnum with a one-bit tag is stored shifted up
#   and steps by TWO, so += 2 and -= 2 are the same question for a tagged
#   representation.  That is the whole reason both step sizes are here.
#
# WHICH IS WHY THE CONSTANTS ARE FREE NOW.  They used to be pinned to imm3 so
# the five bits could ride the imm3 lookup that already existed.  They no longer
# do: rtl/immgen.sv holds a 32-entry table of its own for this mode, indexed by
# the same five bits, so a constant here costs what any other constant costs and
# 256 is exactly as cheap as 2.  The domain is int16 and the only real limit is
# that there are 32 slots.
#
# NO TWO ENTRIES MAY MEAN THE SAME THING, which is a stronger rule than it looks:
# `x <= k` and `x < k+1` are one predicate with two spellings, and so are
# `x <u 1` and `x == 0`.  check.js compares TRUTH SETS rather than spellings, so
# a slot spent on a synonym fails the build instead of quietly halving the table.
#
# THE OTHER SPELLINGS ARE DERIVED, NOT LISTED.  Every `le`, `gt`, `ls` and `hi`
# a programmer writes assembles onto whichever entry means the same thing, and
# tools/gen-customasm.js works out which by comparing truth sets rather than by
# consulting a table of rewrites.  There used to be such a table - thirteen
# hand-written lines - and it was fine while the constants were an imm3 index.
# The moment they were freed it silently stopped covering them: nothing tells
# you that `hi #255` has quietly become unassemblable when `hs #256` arrives.
#
# The derivation is per INSTRUCTION, not per table, and stays that way though
# only one width reads these five bits now.  It mattered when a byte-wide twin
# read the same table at 8: `hi #255` and `hs #256` are two predicates at 16
# bits and one at 8, so a per-table rewrite would have had to be right for both
# at once.  Comparing truth sets never had to know which width it was.
[optype.condimm5]
kind   = "combo"
bits   = 5
parts  = ["cond", "imm"]
domain = { cond = "cond3", imm = "int16" }
values = [
  # signed and equality, against 0, 1, -1 and 2
  ["eq",  0], ["ne",  0], ["lt",  0], ["ge",  0],
  ["eq",  1], ["ne",  1], ["lt",  1], ["ge",  1],
  ["eq", -1], ["ne", -1], ["lt", -1], ["ge", -1],
  ["eq",  2], ["ne",  2], ["lt",  2], ["ge",  2],
  # two signed bounds past 2, where counted loops live
  ["lt",  4], ["ge",  8],
  # the four overflow tests, as plain comparisons.  Only one spelling of each:
  # `ge #32767` and `eq #32767` are the same predicate at 16 bits, since 32767
  # is the largest signed value there is, and a slot spent on the synonym would
  # buy nothing.
  ["ge", 32767], ["ge", 32766], ["lt", -32767], ["lt", -32766],
  # unsigned, against the constants a bound check actually uses.  1 is absent
  # because `lo #1` and `hs #1` are zero tests, and `eq #0` and `ne #0` are too.
  ["lo",  2], ["hs",  2],             ["hs",  3],
  ["lo",  4], ["hs",  4], ["lo",  6],
  ["lo",  8], ["hs",  8],
  # IS IT A BYTE.  The entry the freed constants bought, and it pays for itself
  # in libgcc: __umulhisi3 asks whether its larger operand fits in eight bits,
  # which was `lsr r5, r0, #8` then `br eq, r5, #0` - five bytes, two
  # instructions and the assembler scratch - and is one three-byte instruction
  # with no scratch now.  Both senses, because a branch needs whichever way its
  # fall-through goes.  `lo #3` and `hs #6` paid for them and for the fourth
  # overflow test: they were the least useful entries in the block, since three
  # and six are not shapes anything actually bounds against.
  ["lo", 256], ["hs", 256],
]

# Spellings the assembler accepts and canonicalises onto an entry that IS in the
# table.  Each is an exact identity at both comparison widths, and check.js
# verifies that rather than taking it on trust: `from` must be absent from the
# table, `to` must be present, and the two must have the same truth set.
#
# The rule is simple - every spelling one identity away from an encoded entry.
# Since `lt` is encoded at -1, 0, 1, 2 and 4, `le` follows at -2, -1, 0, 1 and
# 3; likewise `gt` from `ge`.  These cost no table slots at all.
#
# `ls` and `hi` could be completed the same way against the `lo` and `hs`
# entries (`lo #k` is `ls #k-1` for k >= 1) and deliberately are not, until
# something wants them.
# The 3-bit table immediate.
#
# The field does NOT hold the value; it holds an INDEX into `values`.  So a
# written `#6` assembles to field index 6, `#8` to index 7, and `#5` does not
# encode at all.  "Fits" for a table type means "appears in the table", which
# drops straight into the same form-selection test that range checks provide
# for ordinary integers - the assembler needs no special case.
#
# The table is deliberately not an arithmetic sequence.  It spends its eight
# slots on the displacements that actually occur in code, and because pointers
# are tagged that means BOTH parities:
#
#   -1, 1, 3        the first three words of an object reached through a
#                   pointer carrying a tag of 1 - the displacement absorbs the
#                   tag, so these offsets are odd
#   0, 2, 4, 6, 8   the same words through an untagged pointer, plus array and
#                   structure stepping
#
# So -1 is not a general-purpose small negative.  It is the header word of a
# tagged object, and it is plausibly the most common displacement in the entire
# instruction set.  There is no slack in this table to reclaim.
[optype.imm3]
kind   = "table"
bits   = 3
values = [-1, 0, 1, 2, 3, 4, 6, 8]

# The same three bits in the same positions, read for a shift count.
#
# A shift looks only at the low 4 bits of its operand, so the slot that reads
# -1 for an ALU instruction reads 15 for a shift - 0xffff masked to 4 bits is
# 15.  This is a different TABLE, not a different encoding: identical bit
# patterns, identical field layout, no extra hardware.  Only the assembler's
# value-to-index mapping and the disassembler's printing differ, so the
# programmer writes `shl r1, r2, #15` and never has to think about it.
[optype.shift3]
kind   = "table"
bits   = 3
values = [15, 0, 1, 2, 3, 4, 6, 8]

# When branches arrive, their displacement operands should be marked
# `pcrel = true`.  That makes the assembler accept an absolute label or address
# and encode the difference from the address of the *next* instruction, and
# makes the disassembler print the absolute target back - so listings stay
# readable and text -> bytes -> text still round-trips.


# =============================================================================
# Opcode map  (PROVISIONAL - this is the part to argue about)
# =============================================================================
#
#   --- the one-byte region, x000_0xxx ---------------------------------------
#   IT IS IN TWO PIECES AND THAT IS THE SIMPLIFICATION, not the cost.  The
#   sixteen one-byte opcodes are 0000_0xxx and 1000_0xxx - bits 6, 5, 4 and 3
#   clear, bit 7 free - so "is this one byte" is `(op & 0x78) == 0`, four bits
#   against zero, and the fifteen GROUPED rows are one contiguous run at
#   0000_1xxx .. 0111_1xxx with nothing punched out of the middle of them.
#
#   Before, the one-byte block sat whole at 0000_xxxx and the grouped rows ran
#   0001_0xxx .. 1010_1xxx, which is not a range anything can test for.  Two
#   halves and a four-bit mask is the cheaper shape, and splitting a table that
#   has no internal structure to break costs nothing.
#
#   This region has NO structure: no operation field, no register field, no
#   form field.  It is a hand-picked table of fully implicit encodings, chosen
#   by how often the exact instruction occurs rather than by any decomposition.
#   That freedom is the whole reason the first byte is a flat 256-entry table
#   instead of a set of bit fields, and it is why an ALU operation cannot be
#   decoded from a fixed position.
#
#   0000_0000                brk                        1 byte
#   0000_0001                halt                       1 byte
#   0000_0010                rti                        1 byte
#   0000_0011                ld   r0, [r0, #0]          1 byte
#   0000_0100                ld8  r0, [r0, #0]          1 byte
#   0000_0101                add  r0, r0, #1            1 byte
#   0000_0110                add  r0, r0, #-1           1 byte
#   0000_0111                add  r0, r0, #2            1 byte
#   1000_0000                add  r1, r1, r0            1 byte
#   1000_0001                or   r0, r1, #0  = mov     1 byte
#   1000_0010                or   r1, r0, #0  = mov     1 byte
#   1000_0011                mov  r0, #0                1 byte
#   1000_0100                xor  r0, r0, #1            1 byte
#   1000_0101                add  r0, r0, r1            1 byte
#   1000_0110                -- free, 1 one-byte slot
#   1000_0111                nop                        1 byte
#
#   THE THREE EXCEPTION INSTRUCTIONS ARE THE FIRST THREE OPCODES: enter one,
#   wait for one, return from one.  They are adjacent because a wild jump lands
#   on low addresses, and they cost the low half its ninth member - the
#   one-byte region is sixteen slots, not eight, so `add r0, r0, r1' moved out
#   to 0x85 and joined `add r1, r1, r0' in the other half.  It could not go to
#   0000_1000: bit 3 is set there, and "is this one byte" is `(op & 0x78) == 0'.
#
#   THE LOW END OF THE BLOCK IS WHERE A MISTAKE LANDS, and putting the three
#   exception opcodes there is the point.  Erased memory and a zeroed page
#   decode as brk, so a wild jump traps to the handler with the faulting
#   address in lr instead of running on; the two opcodes after it stop the
#   machine and return from a trap.  None of the three takes an operand, so
#   none can be led further astray by the byte that follows.
#
#   nop holds 0x87 at the other end, as far from 0x00 as the block reaches -
#   which matters for the reason brk is at zero in the first place: a nop sled
#   through erased memory is the failure that looks like a working machine, and
#   it is the harder of the two to diagnose.  The split moved nop further from
#   the low end rather than nearer, so the argument survives unchanged.
#
#   Everything between them is an ABBREVIATION - a form of some instruction
#   that also exists in full elsewhere, with every operand pinned.  So the block
#   reads as three things and not sixteen: three exception instructions, eleven
#   pinned forms, one nop, and the free slot sits next to the nop rather than in
#   the middle of the abbreviations.
#   ------------------------------------------------------------------------
#
#   1000_1ddd                mov  rd, #imm16            3 bytes
#   0111_1000                iseq  rd, rd, #imm5      2 bytes
#   0111_1001                iseq  rd, ra, #imm10     3 bytes
#   0111_101i                iseq  rd, ra, #imm3      TWO opcodes
#   0111_1100                isset rd, rd, #immbit5    2 bytes
#   0111_1101                isset rd, rd, #immask5    2 bytes
#   0111_111b                iseq  rd, ra, rb         TWO opcodes
#
#   TWO INSTRUCTIONS IN ONE ROW, chosen by column: the two MASK columns take
#   `isset` and the other six take `iseq`.  See the block above the definitions
#   for why that is regular rather than irregular, and what it buys - a one-bit
#   extract, branchless selection, and a bool-returning function with no branch
#   in it at all, which is the case a compiler hits constantly.
#
#   The only new decode is which comparator, and it is hard-wired to the low
#   three bits.  Everything else - the five immediate modes, the register
#   fields - is the row shape every ALU group already has, so rtl/immgen.sv
#   feeds this row without knowing it exists.
#
#   IT IS THE ONLY INSTRUCTION THAT SPENDS OPCODE BITS ON A REGISTER, and that
#   is why it sits at the bottom of the map rather than the top.  Every other
#   row in 0001_xxxx through 0011_xxxx is a COLUMN structure - the low three
#   bits pick an addressing form and byte 1 has the shape that column implies -
#   and this row's low three bits are a destination register instead.  A single
#   row that reads differently from the eleven around it is worth moving out of
#   them, and the free space at 1010_xxxx is where it costs nothing.
#
#   Moving it up also let the memory block close ranks: ld and st each own a
#   whole row now, in one contiguous run, and mov's constants and the unary
#   operations stopped sharing.
#
#   --- the memory block, four rows -----------------------------------------
#   Three independent bit fields, which is what keeps the decoder small:
#
#     T    0 = load, 1 = store
#     S    0 = 8-bit, 1 = 16-bit
#     fff  addressing form - and it means the same thing on both sides:
#
#       000   rN, [rN, #off5]    2 bytes  one register, tied   LOADS ONLY
#       001   rN, [ra, #imm10]   3 bytes  two registers, wide offset
#       01i   rN, [ra, #imm3]    2 bytes  two registers, TWO opcodes
#       100   -- free
#       101   -- free
#       11i   rN, [ra, rb]       2 bytes  three registers, TWO opcodes
#
#   Because fff means the same thing for loads and stores, byte 1 has an
#   identical layout across all eight memory instructions - register, address
#   register, then whatever the form leaves over.
#
#   Form 000 has no store counterpart on purpose.  It pays for itself on a load
#   because the destination can usefully double as the address register (`ld8
#   r3, [r3, #4]` chases a pointer in place); tying a store's source to its
#   address register would only overwrite the pointer.
#
#   THE WIDE FORM COMES FIRST, EVERYWHERE.  Wherever an instruction exists at
#   both widths, the 16-bit one takes the lower opcode and the byte-wide one
#   the next:
#
#       0x03 ld   / 0x04 ld8        the one-byte implicit pair
#       0x08 st   / 0x10 st8        the store rows
#       0x18 ld   / 0x20 ld8        the load rows
#
#   The 16-bit form is the common one - a byte load is the special case - so it
#   gets the name without a suffix and the opcode you reach first.  Naming and
#   numbering say the same thing, which means neither has to be remembered
#   separately.
#
#   STORES COME FIRST, and the reason is the gap.  A store has no tied form, so
#   its two rows begin at .2 and the .0 and .1 columns stand empty; a load fills
#   .0 with the tied form.  Putting the stores above the loads makes that gap
#   read as the top-left corner of the block rather than a hole punched through
#   its middle, and the widening of the rows going down then matches the reading
#   order.  Nothing decodes differently either way - it is a table that people
#   read, and it reads better in this order.
#
#     0000_1000  -- free               0001_1000  ld   rd,[rd,#off5]
#     0000_1001  st   rs,[ra,#imm10]   0001_1001  ld   rd,[ra,#imm10]
#     0000_101i  st   rs,[ra,#imm3]    0001_101i  ld   rd,[ra,#imm3]
#     0000_111i  st   rs,[ra,rb]       0001_111i  ld   rd,[ra,rb]
#     0001_0000  -- free               0010_0000  ld8  rd,[rd,#off5]
#     0001_0001  st8  rs,[ra,#imm10]   0010_0001  ld8  rd,[ra,#imm10]
#     0001_001i  st8  rs,[ra,#imm3]    0010_001i  ld8  rd,[ra,#imm3]
#     0001_011i  st8  rs,[ra,rb]       0010_011i  ld8  rd,[ra,rb]
#   ------------------------------------------------------------------------
#
#   --- constants and the unary operations, a row each -----------------------
#
#   0010_1000                mov  rd, #imm5             2 bytes
#   0010_1001                movhi rd, ra, #imm10       3 bytes
#   0010_1010 .. 0010_1011   -- free
#   0010_1100                mov  rd, #immbit5          2 bytes
#   0010_1101                mov  rd, #immask5          2 bytes
#   0010_111b                movhi rd, ra, rb           2 bytes
#
#   0011_0000                mul  rd, rd, #imm5         2 bytes
#   0011_0001                mul  rd, ra, #imm10        3 bytes
#   0011_001s                unary ops, 5 in TWO opcodes 2 bytes
#   0011_0100 .. 0011_0101   -- free
#   0011_011b                mul  rd, ra, rb            2 bytes
#
#   THE mov ROW IS AN ALU GROUP WITHOUT AN ALU OPERATION, and it is numbered as
#   one.  `mov rd, #imm` is `or rd, #imm` with the register half thrown away, so
#   the row lines its constant forms up on the same columns the six ALU groups
#   below use: +0 imm5, +4 immbit5, +5 immask5.
#
#   The imm10 column, 0x29, never held a `mov rd, #imm10`: it would be a
#   strictly worse `mov rd, #imm16` - three bytes either way, six fewer bits of
#   range.  It holds movhi instead, which has a register to go with its
#   immediate, and movhi's three-register form fills the row's .6/.7 pair.
#   Before movhi the slot stayed empty rather than take immask5 to close the
#   gap: a reader who knows +5 is the mask column in six groups would have had
#   to learn that the seventh spells it differently, and a decoder built from
#   column arithmetic would have needed a special case for one opcode.  An
#   empty slot in the right place was cheaper than a full one in the wrong
#   place - and it kept the imm10 column for an instruction whose byte 1 is
#   `iiaa_addd`, which is what movhi's is.
#
#   THE UNARY OPERATIONS HAVE A ROW OF THEIR OWN, which they did not before -
#   they shared mov's, three constants and eight operations in eight opcodes.
#   Nothing about that was wrong, but the two have nothing to do with each other
#   and the row read as two half-rows.  The free slots let mul take the ALU
#   group's shape around them: +0, +1 and +6/+7, with the unary pair in +2/+3.
#   It is the row's other operation that is registered - the unary pair at 0x33
#   is the first - so the row holds both of the machine's slow operations.
#
#   AND +4 AND +5 ARE AN EXPANSION PATH WORTH SAYING OUT LOUD.  Each is free and
#   has the `dddi_iiii` shape: one register and FIVE spare bits.  A unary whose
#   destination is tied to its source - `rd = f(rd)`, the same tie
#   `ld rd, [rd, #off5]` already uses - spends nothing on a second register, so
#   those five bits are all selector:
#
#       byte 0 = 0011_0100, byte 1 = dddi_iiii
#       -> 32 single-register unary operations
#
#   That is more than five times the two-opcode form's six, out of ONE opcode,
#   and +5 could do the same again.  +0 held this paragraph until mul took it.
#   So the six at 0011_001s are not a ceiling on unary operations; they are the
#   ceiling on unary operations that want a separate destination.  Nothing
#   occupies +4 yet because nothing needs it - it is written down so that "the
#   unary encoding is full" is never a reason to put an operation somewhere
#   worse.
#
#   THE UNARY OPERATIONS ARE STILL IN THE RIGHT COLUMN, and the column is the
#   whole argument for putting them here.  Byte 1 of a unary op is
#
#       d d d a a a s s      destination, source, operation selector
#
#   which is the same shape as byte 1 of every `rd, ra, #imm3` form in the map -
#   two register fields and a small one left over.  So they belong in columns
#   .2 and .3, where every other instruction with that byte-1 layout already
#   sits: the load and store displacement forms above, and the ALU's imm3 forms
#   below.  They are not two-register instructions that happen to have a
#   selector; they are three-operand instructions whose third operand is the
#   opcode.
#
#   From here down to the end of the push and pop block, columns .2 and .3 hold
#   nothing but that layout: st8, st, ld8, ld, the unary ops, all six ALU
#   groups, then push and pop.  Eighteen consecutive rows where byte 1 is
#   two register fields and a remainder.
#   ------------------------------------------------------------------------
#
#   --- the ALU block --------------------------------------------------------
#   WHICH OPERATION IS NOT A BIT FIELD.  Single-byte encodings with an implicit
#   operation are coming, and those have no room for a selector at a fixed
#   offset - so nothing downstream may decode an ALU operation by extracting
#   bits at a known position.  The first-byte table is the only authority.  The
#   aligned groups of eight below are a convenience for reading the map, not a
#   contract the decoder may rely on.
#
#   Every ALU operation is 16-bit only, and takes the same four forms in the
#   same six opcodes.  Relative to the base of its group:
#
#       +0   rd, rd, #imm5     2 bytes  dest doubles as source, wide imm
#       +1   rd, ra, #imm10    3 bytes  two regs + wide imm
#       +2   rd, ra, #imm3     2 bytes  two regs + table imm, TWO opcodes
#       +3     "
#       +4   rd, rd, #immbit5  2 bytes  as +0, single-bit constants
#       +5   rd, rd, #immask5  2 bytes  as +0, field and stripe masks
#       +6   rd, ra, rb        2 bytes  THREE registers, TWO opcodes
#       +7     "
#
#   Forms +0, +1 and +2 are the memory block's 000 / 001 / 01i shapes reused
#   unchanged.  Form +6 is the one the memory block has no use for: it spends
#   the stolen opcode bit on a third register rather than an immediate bit.
#
#   THE COLUMN BITS ARE A TREE OVER THE IMMEDIATES.  opcode[2] picks the two
#   mask tables, which rtl/immgen.sv builds as one shifter; below it opcode[1]
#   picks imm3; below that opcode[0] picks between the two sign-extended
#   slices, imm5 and imm10.  Each level of the immediate mux reads one bit.  It
#   was +1 immbit5 and +4 imm10 until measured: swapping them, with immask5
#   reordered to share immbit5's shifter, took the immediate block and its
#   mux 18 LUT4 smaller and the processor 9, at the same clock.  See
#   optype.immask5.
#
#   FORMS +4 AND +5 ARE PER-OPERATION and neither is claimed by all eight.
#
#     0x38  add      0x40  rsb      0x48  xor      0x50  or      0x58  and
#
#   +4 is immbit5, single bits and their complements, and four operations take
#   it: 0x3c `add rd, rd, #1<<n` - and the complement half makes that a
#   subtract of a power of two - 0x4c bit flip, 0x54 bit set, 0x5c bit clear.
#   rsb leaves it free because a single-bit reverse subtract is nothing in
#   particular, and the shifts because a shift distance is four bits.
#
#   +5 is immask5, the field and stripe masks, and the same four take it:
#   0x3d, 0x4d, 0x55, 0x5d.  Extracting a nibble, clearing a tag, adding into
#   a field, and the SWAR masks a popcount or bit reversal walks - all two
#   bytes and no constant to build first.
#
#   The shifts take the same group shape but only three of the forms: no imm10
#   (a shift count never needs ten bits), no mask forms, and no one-byte
#   encodings.  Five opcodes each, and +1, +4 and +5 go unused in their
#   groups.
#
#     0x60  shl      0x68  asr      0x70  lsr
#
#   Their imm3 slot is read through the `shift3` table instead of `imm3`, so it
#   spells 15 where an ALU instruction spells -1.  Same bits, same positions.
#
#   That fills 0x38..0x77.  Nothing about the layout is load-bearing - decode
#   is a flat 256-entry table - so a later operation can go wherever it fits.
#
#   The two free slots in each group are NOT where the single-byte implicit
#   forms live; those are up in the unstructured one-byte region, where `add`
#   already holds 0x05..0x07, 0x80 and 0x85.  There is deliberately no one-byte
#   `add rd, rs`: covering all 64 register pairs would cost a quarter of the
#   map, while the two pairs that actually dominate cost two opcodes.
#   ------------------------------------------------------------------------
#
#   THE GROUPED REGION IS NOW FULL: fifteen rows of eight, 0000_1xxx through
#   0111_1xxx, with no gaps between them.  A sixteenth grouped operation has
#   nowhere contiguous to go, which is the price of the tidiness - there are 80
#   free opcodes at 1011_xxxx and above, but none of them adjoin this block.
#   ------------------------------------------------------------------------
#
#   --- push / pop -----------------------------------------------------------
#   Separate state machines, separate opcodes, no register masks, no
#   coalescing.  8-bit is single register only - a byte on the stack is an
#   argument, never part of a register save.  16-bit comes in ones, twos and
#   threes, which is what register saving actually wants.
#
#   Byte 1 holds nothing but registers in every one of these:
#     one   aaa0_0000        two   aaab_bb00        three  aaab_bbcc
#
#   THE COLUMNS LINE UP AND THAT IS DELIBERATE.  Push and pop are the same
#   table twice, and every form sits in the column its BYTE 1 belongs to:
#
#     +0   aaa0_0000   one register    with every other reg + 5-bit form
#     +4   aaa0_0000   one register    the byte-wide pair of the same
#     +2   aaab_bb00   two registers   with every other reg + reg + field
#     +6/7 aaab_bbcc   three registers with the three-register ALU forms
#
#   So the 16-bit form - the common one, the one a prologue uses - is at +0
#   where the eye lands, and the byte form sits in the next one-register column, +4.  Reading down
#   a column of the opcode map tells you the shape of byte 1 and nothing else
#   has to be remembered.
#
#   1001_0000                push ra                  2 bytes
#   1001_0001                stm  ra                  2 bytes
#   1001_0010                push ra, rb              2 bytes
#   1001_0011                stm  ra, rb              2 bytes
#   1001_010c                stm  ra, rb, rc          TWO opcodes
#   1001_011c                push ra, rb, rc          TWO opcodes
#   1001_1000                pop  ra                  2 bytes
#   1001_1001                ldm  ra                  2 bytes
#   1001_1010                pop  ra, rb              2 bytes
#   1001_1011                ldm  ra, rb              2 bytes
#   1001_110c                ldm  ra, rb, rc          TWO opcodes
#   1001_111c                pop  ra, rb, rc          TWO opcodes
#
#   THE ROW IS FULL, AND IT IS THE SAME SHAPE FOUR TIMES: one register, two
#   registers, three registers, for each of push, stm, pop and ldm.  Reading
#   down a column still tells you the shape of byte 1 and nothing else has to
#   be remembered - the low half stores and the high half loads, the stack
#   forms on the even column pair and the pointer-walking forms on the odd.
#
#   WHAT PAID FOR IT.  `push8` and `pop8` held 1001_0100 and 1001_1100, and a
#   three-register form needs an ADJACENT EVEN/ODD PAIR for the opcode bit that
#   carries its ninth register bit.  Every odd slot in this row was free and
#   every even one was taken, so the byte forms were the only way to make a
#   pair.  See the stm/ldm section for what that trade buys.
#   ------------------------------------------------------------------------
#
#   --- control flow, all of it, in exactly two rows -------------------------
#   EVERY PROGRAM TRANSFER OF CONTROL IS 1010_xxxx AND NOTHING ELSE IS - every
#   branch, jump, call and return, including `ret` at 1010_1011.  It is one
#   byte and has no operand to encode; it simply spends one of this block's
#   opcodes rather than one of the sixteen in the one-byte region, which is the
#   scarcer of the two.
#
#   THE EXCEPTIONS ARE NOT IN THIS ROW AND ARE NOT MEANT TO BE.  brk and rti
#   write the pc from 0x00 and 0x02, and that does not weaken the rule, because
#   the rule is about the transfers a compiler EMITS, a disassembler FOLLOWS and
#   a decoder PREDICTS.  An exception is reached from a pin or a trap rather
#   than from the instruction stream, and its destination is a chip constant
#   rather than anything in the instruction, so nothing that reads this row is
#   looking for it.  See the exception block below.
#
#   WHAT THE ROW GIVES UP IS ITS LENGTH REGULARITY, at .e and .f.  `ret` was the
#   only one-byte member; sei and cli make three, so reading length from the
#   bits alone now means `.b, .e, .f` rather than one exception.  Two of the
#   sixteen one-byte opcodes would have cost more - see the sei/cli block.
#
#   1010_0000                br      <cond,#imm5>, ra, target
#   1010_0001                jmp     target             3 bytes, absolute
#   1010_0010                jmp     ra                 2 bytes, INDIRECT
#   1010_0011                jmpr    target             2 bytes, SHORT form
#   1010_0100                brclr   ra, #immbit5, target
#   1010_0101                brclr   ra, #immask5, target
#   1010_011z                br      <cond>, ra, rb, target    TWO opcodes
#   1010_1000                -- free
#   1010_1001                call    target             3 bytes, absolute
#   1010_1010                call    ra                 2 bytes, INDIRECT
#   1010_1011                ret                        1 byte, pc = lr
#   1010_1100                brset   ra, #immbit5, target
#   1010_1101                brset   ra, #immask5, target
#   1010_1110                sei                        1 byte, ie = 1
#   1010_1111                cli                        1 byte, ie = 0
#   1011_0000 .. 1111_1111   -- free, 80 slots
#
#   AND THE COLUMNS SAY WHAT BYTE 1 LOOKS LIKE, exactly as they do everywhere
#   else in the map:
#
#     .0 .4 .5   aaa?_????   one register and a 5-bit field
#     .6 .7      cccb_bbee   two registers and a condition
#     .1         iiii_iiii   a 16-bit target and no register at all
#     .2         0000_0aaa   one register: the indirect transfers
#     .3         tttt_tttt   a displacement byte
#
#   THE SHORT FORMS SIT IN ADJACENT COLUMNS, which is why jmp and call put
#   their imm16 form at .1 and their register form at .2 rather than the other
#   way round.  Nothing in this implementation reads a length from the opcode -
#   the byte-serial core's ucode.sv's entry word says how many bytes to fetch, and binutils
#   carries a 256-entry table - so the arrangement buys it nothing.  It is for
#   a decoder that wants the answer from the bits alone, where `is this three
#   bytes' is the most critical question asked and the one that cannot wait.
#   With the short forms at .2 and .3 it is op[2:1] == 01: two adjacent bits,
#   the low one a don't-care.  With them at .1 and .3, where they were, it
#   needed bit 0 and bit 2.  `ret' at .3 is one byte rather than two, so the
#   test answers "not three" rather than "exactly two".
#
#   AND FIVE COLUMNS ARE PAIRS SPLIT BY BIT 3: .4 and .5 are brclr against
#   brset, and .1, .2 and .3 are a jump against the call that reaches the same
#   way.  .0, .6 and .7 were the branch against a byte-wide twin and lost it,
#   so 1010_1000 and 1010_111z stand free below the branch row.
#
#   .0, .4 AND .5 ARE THE ALU'S CONSTANT COLUMNS, and that is not an analogy.
#   Byte 1 of `br cond, ra, #imm5` is `aaak_kkkk` and byte 1 of `brclr ra,
#   #mask` is `aaam_mmmm`: one register and five bits, identically placed.  The
#   only difference is which table reads the five bits - a packed condition and
#   signed constant at +0, immbit5 at +4, immask5 at +5 - which is precisely the
#   +0 / +4 / +5 relationship every ALU group has.  So the branches on a mask
#   sit in the mask columns, and clear-versus-set is the row rather than bit 0.
#
#   .6 AND .7 ARE THE THREE-REGISTER COLUMNS, and that is why the two-register
#   branches are there rather than at .2 and .3.  Byte 1 of `br cond, ra, rb` is
#   `cccb_bbee` and byte 1 of `add rd, ra, rb` is `ddda_aacc`: byte1[5:3] is ALU
#   port A in both and byte1[1:0] plus the stolen opcode bit is ALU port B in
#   both.  Only the top field differs - a condition where the ALU has a
#   destination - so the register decode is not merely similar, it is the same
#   wires.  The branch's two registers are the other way round from its syntax
#   for exactly that reason; see the br section below.
#
#   .2 AND .3 ARE THE FOUR WIDE TARGETS, AS A 2x2.  Bit 0 is absolute against
#   pc-relative and bit 3 is jump against call, so jmp and call are 0xa2 and
#   0xaa, one bit apart, with the same byte 1: a 16-bit target and no register.
#   The relative half of that 2x2 is gone - see below - so .3 and .b are free
#   and keep the shape for whatever wants a wide operand next.
#
#   .1 IS THE REGISTER COLUMN, and it keeps the jump-against-call sense of bit
#   3 exactly: `jmp ra` above, `call ra` below, the same `0000_0aaa` byte 1 and
#   the same three cycles - one to read the register, one to present it, one
#   for the target's opcode.  It used to hold the leftovers, a short `jmpr`
#   against an indirect `call`, which shared no byte-1 layout at all; giving
#   the register forms the column and the displacement its own at .3 costs
#   nothing and makes every column mean one thing again.
#   ------------------------------------------------------------------------
#
#   0111_1xxx                iseq / isset               see above
#
#   1011_xxxx                -- free, 16 slots
#   11xx_xxxx                -- free, a quarter of the map
#
# Note how cheap the one-byte two-register block is: `01dddsss` costs a quarter
# of the opcode space and buys a fully general reg,reg operation.  That trade -
# a few dense one-byte ops against a large sparse two-byte space - is the main
# thing to tune while the map is still soft.
# =============================================================================


# =============================================================================
# Instructions
# =============================================================================

# --- ld8 --------------------------------------------------------------------
# Load an 8-bit value, zero-extended into a 16-bit register.
#
# Four encodings, in increasing size.  The assembler tries them in the order
# listed and takes the first whose constraints the written operands satisfy:
#
#   implicit    1 byte   everything pinned: dest r0, address r0, offset 0
#   reg_off5    2 bytes  wide offset, but destination is TIED to the address
#   reg_reg     2 bytes  separate destination and address, but the offset must
#                        come from the 8-entry imm3 table
#   reg_reg10   3 bytes  separate registers AND a -512..+511 offset
#
# The two-byte forms trade against each other rather than one dominating: one
# buys offset range at the cost of a register, the other buys a register at the
# cost of offset range.  The three-byte form buys both.
#
# imm10 is deliberately where the ladder stops.  If a displacement will not fit
# in -512..+511, the compiler computes the address into a spare register first;
# with eight registers that is cheap, and it saves the encoding from growing a
# four-byte tier that would earn its keep only rarely.  So the assembler CAN
# legitimately reject an `ld8` - a displacement out of imm10 range is a source
# error, not a missing form.
[[insn]]
mnemonic = "ld8"
summary  = "load 8-bit, zero extended"
operands = [
  { name = "d",   type = "reg"  },   # destination register
  { name = "a",   type = "reg"  },   # address register
  { name = "off", type = "int16" },   # signed byte displacement (logical)
]
syntax   = "{d}, [{a}, #{off}]"
semantics = "R[d] = M8[R[a] + off]"

  [[insn.form]]
  name     = "implicit"
  encoding = "0000_0100"
  fix      = { d = 0, a = 0, off = 0 }

  [[insn.form]]
  name     = "reg_off5"
  encoding = "0010_0000  oooo_oaaa"
  fields   = { o = "off:imm5" }
  tie      = { d = "a" }             # one field serves as address and dest

  # The 3-bit table immediate is split across the instruction: its LOW bit is
  # the low bit of the opcode byte, so this form burns two adjacent opcodes
  # (0x22 and 0x23).  Its other two bits sit at the bottom of byte 1.
  #
  #     byte 0:  0 0 1 0 0 0 1 i     7-bit opcode, then off bit 0
  #     byte 1:  d d d a a a j j     dest, address, then off bits 2 and 1
  #
  # Paying an opcode bit to widen the register fields is the whole trick here:
  # it is what makes room for a separate destination and address in two bytes.
  [[insn.form]]
  name     = "reg_reg"
  encoding = "0010_001i  jjaa_addd"
  fields   = { i = "off:imm3[0]", j = "off:imm3[2:1]" }

  # Three bytes, and in exchange everything is independent and nothing is
  # scattered: a whole opcode byte, then dest, address and a signed 10-bit
  # displacement laid out in significance order.
  #
  #     byte 0:  0 0 1 0 0 0 0 1   full 8-bit opcode
  #     byte 1:  d d d a a a i i   dest, address, off bits 9..8
  #     byte 2:  i i i i i i i i   off bits 7..0
  [[insn.form]]
  name     = "reg_reg10"
  encoding = "0010_0001  iiaa_addd  jjjj_jjjj"
  fields   = { i = "off:imm10[1:0]", j = "off:imm10[9:2]" }


# --- ld -------------------------------------------------------------------
# Load a 16-bit value.  Structurally identical to ld8 - same four addressing
# forms, same operand shape, same field layouts - differing only in opcode bit
# 3, which is the width bit for the whole load block.
#
# DECIDED: displacements count BYTES and are NOT scaled by the access width,
# for ld and st alike.  Scaling would have doubled the reach of the off5
# and imm10 forms for almost no hardware cost, and it is still rejected,
# because POINTERS ARE TAGGED.  A heap reference carries a tag in its low bit,
# so the displacement is what removes it:
#
#     ld rd, [rp, #-1]     first word of an object behind a tag-1 pointer
#     ld rd, [rp, #1]      second word
#     ld rd, [rp, #3]      third
#
# Those displacements are ODD.  A scaled offset cannot express them at all, and
# would put a shift or an add in front of every single field access.  Byte
# displacements are not a conservative default here; they are load bearing.
#
# ALSO DECIDED: unaligned accesses are allowed.  An odd effective address reads
# or writes two consecutive bytes, in the `endian` order declared at the top,
# with no fault and no penalty visible to software.  Given that displacements
# do the tag arithmetic, a correct field access lands aligned anyway - this
# just means the hardware never has to say no.
[[insn]]
mnemonic = "ld"
summary  = "load 16-bit"
operands = [
  { name = "d",   type = "reg"  },
  { name = "a",   type = "reg"  },
  { name = "off", type = "int16" },
]
syntax   = "{d}, [{a}, #{off}]"
semantics = "R[d] = M16[R[a] + off]"

  [[insn.form]]
  name     = "implicit"
  encoding = "0000_0011"
  fix      = { d = 0, a = 0, off = 0 }

  [[insn.form]]
  name     = "reg_off5"
  encoding = "0001_1000  oooo_oaaa"
  fields   = { o = "off:imm5" }
  tie      = { d = "a" }

  [[insn.form]]
  name     = "reg_reg"
  encoding = "0001_101i  jjaa_addd"
  fields   = { i = "off:imm3[0]", j = "off:imm3[2:1]" }

  [[insn.form]]
  name     = "reg_reg10"
  encoding = "0001_1001  iiaa_addd  jjjj_jjjj"
  fields   = { i = "off:imm10[1:0]", j = "off:imm10[9:2]" }


# --- st8 / st -------------------------------------------------------------
# Stores get exactly two forms each - the two-register forms from the load
# block, and nothing else.  There is no tied form (a store's source register is
# not usefully its own address register) and no implicit one-byte form (storing
# r0 through r0 at offset 0 is not a shape that occurs).
#
# So a store is always at least two bytes, and its byte 1 is laid out exactly
# like a load's: register, address register, then the immediate remainder.
[[insn]]
mnemonic = "st8"
summary  = "store low 8 bits"
operands = [
  { name = "s",   type = "reg"  },   # source register
  { name = "a",   type = "reg"  },   # address register
  { name = "off", type = "int16" },
]
syntax   = "{s}, [{a}, #{off}]"
semantics = "M8[R[a] + off] = R[s]"

  [[insn.form]]
  name     = "reg_reg"
  encoding = "0001_001i  jjaa_asss"
  fields   = { i = "off:imm3[0]", j = "off:imm3[2:1]" }

  [[insn.form]]
  name     = "reg_reg10"
  encoding = "0001_0001  iiaa_asss  jjjj_jjjj"
  fields   = { i = "off:imm10[1:0]", j = "off:imm10[9:2]" }


[[insn]]
mnemonic = "st"
summary  = "store 16 bits"
operands = [
  { name = "s",   type = "reg"  },
  { name = "a",   type = "reg"  },
  { name = "off", type = "int16" },
]
syntax   = "{s}, [{a}, #{off}]"
semantics = "M16[R[a] + off] = R[s]"

  [[insn.form]]
  name     = "reg_reg"
  encoding = "0000_101i  jjaa_asss"
  fields   = { i = "off:imm3[0]", j = "off:imm3[2:1]" }

  [[insn.form]]
  name     = "reg_reg10"
  encoding = "0000_1001  iiaa_asss  jjjj_jjjj"
  fields   = { i = "off:imm10[1:0]", j = "off:imm10[9:2]" }


# --- the index forms ------------------------------------------------------
# fff = 11i, the last of the memory block's addressing forms and the only one
# whose displacement is a REGISTER.  Two opcodes each, for the reason the imm3
# forms take two: a third register needs three bits and byte 1 has two to
# spare, so the low bit rides the opcode.  The index is
# {byte1[7:6], opcode[0]} - the same three bits, in the same places, that the
# three-register ALU forms use, which is why nothing in the datapath is new:
# the address register arrives on port A, the index on port B, and the adder
# that was already computing `R[a] + off` computes `R[a] + R[b]` instead.
#
# THE INDEX IS UNSCALED, at both widths and for loads and stores alike.  That
# is the same decision the displacements took and it is the same argument:
# pointers are tagged, so the arithmetic that lands on a field is odd as often
# as not, and a scaled index cannot express an odd address at all.  Scaling
# would also put a shift in front of the adder for every indexed access,
# including the untagged ones that would never use it.
#
# THESE ARE SEPARATE ENTRIES RATHER THAN FORMS, because a form shares its
# instruction's operand list: `off` is an int16 and `b` is a register, and no
# one entry can say both.  The mnemonic is the same and the assembler chooses
# on the syntax, which is unambiguous - `#3` is a displacement and `r3` is an
# index.  add, jmp and call are split the same way for the same reason.
[[insn]]
mnemonic = "ld8"
summary  = "load 8-bit through a register index, zero extended"
operands = [
  { name = "d", type = "reg" },   # destination register
  { name = "a", type = "reg" },   # address register
  { name = "b", type = "reg" },   # index register, split across both bytes
]
syntax   = "{d}, [{a}, {b}]"
semantics = "R[d] = M8[R[a] + R[b]]"

  [[insn.form]]
  name     = "reg_reg_reg"
  encoding = "0010_011b  ccaa_addd"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }


[[insn]]
mnemonic = "ld"
summary  = "load 16-bit through a register index"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{d}, [{a}, {b}]"
semantics = "R[d] = M16[R[a] + R[b]]"

  [[insn.form]]
  name     = "reg_reg_reg"
  encoding = "0001_111b  ccaa_addd"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }


[[insn]]
mnemonic = "st8"
summary  = "store low 8 bits through a register index"
operands = [
  { name = "s", type = "reg" },   # source register
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{s}, [{a}, {b}]"
semantics = "M8[R[a] + R[b]] = R[s]"

  [[insn.form]]
  name     = "reg_reg_reg"
  encoding = "0001_011b  ccaa_asss"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }


[[insn]]
mnemonic = "st"
summary  = "store 16 bits through a register index"
operands = [
  { name = "s", type = "reg" },
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{s}, [{a}, {b}]"
semantics = "M16[R[a] + R[b]] = R[s]"

  [[insn.form]]
  name     = "reg_reg_reg"
  encoding = "0000_111b  ccaa_asss"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }


# --- mov --------------------------------------------------------------------
# Two forms.  The short one is a register and a signed 5-bit immediate, laid
# out exactly like an ALU +0 form.  The wide one carries a full 16-bit value.
#
# The wide form costs EIGHT opcodes, and that is the cheap option rather than
# the expensive one.  Three bytes is 24 bits; 16 of immediate plus 3 of
# register leave only 5 for the opcode, so the destination has to live in the
# opcode byte.  Giving it a full 8-bit opcode instead would push the
# instruction to four bytes to say the same thing.
#
# The imm16 field is the general wide-immediate form, and jmp and call will
# want it too - so those eight opcodes buy an addressing shape, not just a mov.
#
# There is no register-to-register mov opcode; that is a preferred alias onto
# `or`, defined at the end of this file.
[[insn]]
mnemonic = "mov"
summary  = "rd = immediate"
operands = [
  { name = "d",   type = "reg"   },
  { name = "imm", type = "int16" },
]
syntax   = "{d}, #{imm}"
semantics = "R[d] = imm"

  # ZEROING r0 IS ONE BYTE.  The 65C02 added STZ for exactly this reason -
  # clearing a location was the commonest thing a program did that the 6502
  # had no short way to say - and setting a register to zero is the same
  # observation one level in.  Loop counters, accumulators, null pointers and
  # cleared flags are all this instruction, and r0 is where a return value and
  # a first argument live, so it is the register they most often want.
  #
  # It costs one of the free one-byte slots and pins both operands, which is
  # what an abbreviation is: a form of `mov` with nothing left to say.  Three
  # are left after this and `ret`.
  [[insn.form]]
  name     = "r0_zero"
  encoding = "1000_0011"
  fix      = { d = 0, imm = 0 }

  [[insn.form]]
  name     = "reg_imm5"
  encoding = "0010_1000  iiii_iddd"
  fields   = { i = "imm:imm5" }

  # The same two-byte shape, the same five bits, read through immbit5 instead
  # of as a signed integer.  That is what puts every power of two - and every
  # value one bit short of all-ones - into two bytes rather than three.
  #
  # imm5 already reaches 1, 2, 4 and 8, so the assembler drops those entries
  # from this form; what it is really buying is 16 upwards, 0x8000, and the
  # complements from -17 down.  `mov rd, #16` was three bytes before this form
  # existed, which is a bad cliff to have one past the end of a signed 5-bit
  # field.
  [[insn.form]]
  name     = "reg_immbit5"
  encoding = "0010_1100  iiii_iddd"
  fields   = { i = "imm:immbit5" }

  # And the mask table.  Loading 0x00ff or 0xf000 was three bytes before this;
  # a routine that masks with a constant usually has to build it first.
  [[insn.form]]
  name     = "reg_immask5"
  encoding = "0010_1101  iiii_iddd"
  fields   = { i = "imm:immask5" }

  # Destination in the opcode byte, then a whole 16-bit immediate.  No
  # narrowing happens here - the encoded type is the logical type - which is
  # the one case where a form can represent everything the programmer writes.
  #
  # The immediate is stored LOW BYTE FIRST, matching `endian`, so the fetch
  # unit assembles a 16-bit instruction immediate exactly the way it assembles
  # a 16-bit data word.  The bit map is written most-significant-first, so
  # saying that takes an explicit split: `i` carries bits 7..0 and `j` carries
  # bits 15..8.
  [[insn.form]]
  name     = "reg_imm16"
  encoding = "1000_1ddd  iiii_iiii  jjjj_jjjj"
  fields   = { i = "imm:int16[7:0]", j = "imm:int16[15:8]" }


# --- movhi -------------------------------------------------------------------
# ra with its high byte replaced: rd = (x << 8) | (ra & 0xff), where x is the
# low byte of rb or of the immediate.  One ALU operation - the result's high
# byte is rhs[7:0] and its low byte lhs[7:0] - so the two forms share it, and
# they sit in the mov row's imm10 and three-register columns, 0x29 and
# 0x2e/0x2f, with exactly the byte-1 layouts those columns have everywhere
# else.  No addressing mode is new: the immediate is imm10, and the operation
# reads its low eight bits.
#
# WHAT IT IS FOR.  A register's low byte and something else's in one register:
#
#   - clmul's operands, which are the two bytes of one register.  clmul is
#     commutative, so the variable can go low and the constant high, and
#     `movhi r4, r3, #m` packs a CRC's Barrett constant with no register to
#     hold it - three bytes, where `or r4, r3, #0xf600` is five through r5.
#   - the 6502's page-indexed addressing: with a 256-byte table on a page
#     boundary, `movhi r, idx, #page` then `ld8 r, [r]` is the lookup, and
#     it cleans the index's high byte on the way.
#   - the three-register form packs two variables, which is what an elliptic
#     curve multiply's clmul inner loop does; measured, about 12% faster.
#
# THE IMMEDIATE GOES HIGH AND THE REGISTER LOW, and not the other way round.
# For clmul the two orders are equal; beyond it, a constant under a shifted
# register - `(ra << 8) | #k` - is rare, and `#0` would only repeat `shl rd,
# ra, #8`.  This order is page indexing, and zero extension and setting the
# high byte in one, where the alternative is `and`, `mov r5` and `add`.
#
# IT COSTS THREE CELLS: one more arm on the ALU's result mux, wiring into it.
# Measured on the processor behind one SPRAM, medians of sixteen seeds, 1345
# LUT4 at 29.80 MHz before and 1348 at 29.40 after - a move well inside the
# spread of 27.7 .. 30.6, so no clock the seeds can see.
#
# It is not a `movhi` in the sense of a load-high-immediate: with the low
# byte also constant that is `mov rd, #imm16`, which exists.  And `#0` is
# zero extension, which `and rd, rd, #0xff` already is in two bytes.
[[insn]]
mnemonic = "movhi"
summary  = "rd = (rb << 8) | (ra & 0xff)"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{d}, {a}, {b}"
semantics = "R[d] = ((R[b] & 0xff) << 8) | (R[a] & 0xff)"

  [[insn.form]]
  name     = "three_reg"
  encoding = "0010_111b  ccaa_addd"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }

[[insn]]
mnemonic = "movhi"
summary  = "rd = (immediate << 8) | (ra & 0xff)"
operands = [
  { name = "d",   type = "reg"   },
  { name = "a",   type = "reg"   },
  { name = "imm", type = "int16" },
]
syntax   = "{d}, {a}, #{imm}"
semantics = "R[d] = ((imm & 0xff) << 8) | (R[a] & 0xff)"

  [[insn.form]]
  name     = "reg_reg_imm10"
  encoding = "0010_1001  iiaa_addd  jjjj_jjjj"
  fields   = { i = "imm:imm10[1:0]", j = "imm:imm10[9:2]" }


# --- add ---------------------------------------------------------------------
# Six opcodes, four forms, split across two entries because the second source
# is a register in one shape and an immediate in the others.
#
# All ALU operations are 16-bit only; there is no width bit in this block and
# no 8-bit add.
#
# Entry 1 of 2: the three-register form.  It buys its third register the same
# way the imm3 forms buy their bottom immediate bit - by stealing the low bit
# of the opcode byte, so it occupies an adjacent pair.
#
#     byte 0:  0 1 0 0 0 1 1 b   7-bit opcode, then rb bit 0
#     byte 1:  d d d a a a c c   dest, first source, rb bits 2 and 1
[[insn]]
mnemonic = "add"
summary  = "rd = ra + rb"
operands = [
  { name = "d", type = "reg" },   # destination
  { name = "a", type = "reg" },   # first source
  { name = "b", type = "reg" },   # second source, split across both bytes
]
syntax   = "{d}, {a}, {b}"
semantics = "R[d] = R[a] + R[b]"

  # Two fully implicit one-byte encodings for the two register triples that
  # dominate in practice.  Listed first only for readability - forms are tried
  # shortest-first regardless of the order they appear here.
  [[insn.form]]
  name     = "r0_r0_r1"
  encoding = "1000_0101"
  fix      = { d = 0, a = 0, b = 1 }

  [[insn.form]]
  name     = "r1_r1_r0"
  encoding = "1000_0000"
  fix      = { d = 1, a = 1, b = 0 }

  [[insn.form]]
  name     = "three_reg"
  encoding = "0011_111b  ccaa_addd"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }


# Entry 2 of 2: the immediate forms.  These are exactly the memory block's
# 000 / 01i / 100 shapes, reused unchanged - a tied register with a wide 5-bit
# immediate, two registers with a table immediate, two registers with imm10.
[[insn]]
mnemonic = "add"
summary  = "rd = ra + immediate"
operands = [
  { name = "d",   type = "reg"   },
  { name = "a",   type = "reg"   },
  { name = "imm", type = "int16" },
]
syntax   = "{d}, {a}, #{imm}"
semantics = "R[d] = R[a] + imm"

  # Increment, decrement and step-by-two on r0, in one byte each.  Everything
  # is pinned, so these carry no fields at all.
  [[insn.form]]
  name     = "inc_r0"
  encoding = "0000_0101"
  fix      = { d = 0, a = 0, imm = 1 }

  [[insn.form]]
  name     = "dec_r0"
  encoding = "0000_0110"
  fix      = { d = 0, a = 0, imm = -1 }

  [[insn.form]]
  name     = "inc2_r0"
  encoding = "0000_0111"
  fix      = { d = 0, a = 0, imm = 2 }

  # Destination doubles as the first source, which frees five bits for the
  # immediate.  Prints as `add r3, r3, #20`.
  [[insn.form]]
  name     = "reg_imm5"
  encoding = "0011_1000  iiii_iddd"
  fields   = { i = "imm:imm5" }
  tie      = { a = "d" }

  # ADDING A POWER OF TWO.  imm5 already reaches 1, 2, 4 and 8, so what this
  # buys is 16 upwards and 0x8000 - and the complements, which are the
  # subtractions: `add rd, rd, #0xfff0` is minus sixteen.  The slot was
  # reserved for immbit5 in every one of the eight ALU groups and nothing had
  # asked for it here.
  [[insn.form]]
  name     = "reg_immbit5"
  encoding = "0011_1100  iiii_iddd"
  fields   = { i = "imm:immbit5" }
  tie      = { a = "d" }

  # And the mask table, for the same reason it is on and/or/xor: a field is
  # often added to as well as masked out.
  [[insn.form]]
  name     = "reg_immask5"
  encoding = "0011_1101  iiii_iddd"
  fields   = { i = "imm:immask5" }
  tie      = { a = "d" }

  [[insn.form]]
  name     = "reg_reg_imm3"
  encoding = "0011_101i  jjaa_addd"
  fields   = { i = "imm:imm3[0]", j = "imm:imm3[2:1]" }

  [[insn.form]]
  name     = "reg_reg_imm10"
  encoding = "0011_1001  iiaa_addd  jjjj_jjjj"
  fields   = { i = "imm:imm10[1:0]", j = "imm:imm10[9:2]" }


# --- rsb / xor / or / and ---------------------------------------------------
# Structurally identical to `add`, group base by group base.  See the `add`
# comments above for the field layouts; only the opcode group and the meaning
# of the operation change.
#
# There is no subtract.  `rsb` computes SECOND minus FIRST, which is what lets
# a single opcode cover both `a - b` (swap the operands) and `imm - a` (the
# shape you actually want for an immediate subtract-from).  The `sub` mnemonic
# is an assembler alias, defined at the end of this file.
#
# The bitwise operations take the same int16 immediates as the arithmetic ones,
# and because int16 wraps, a mask is written in whichever spelling reads best.
# What decides the cost is the value's SIGNED reading: 0xff00 wraps to -256 and
# fits imm10, so `and rd, ra, #0xff00` is three bytes.  A mask that lands
# outside -512..511 either way - 0x0fff, say - needs `mov rd, #imm16` and the
# three-register form.

[[insn]]
mnemonic = "rsb"
summary  = "rd = rb - ra   (reverse subtract)"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{d}, {a}, {b}"
semantics = "R[d] = R[b] - R[a]"

  [[insn.form]]
  name     = "three_reg"
  encoding = "0100_011b  ccaa_addd"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }

[[insn]]
mnemonic = "rsb"
summary  = "rd = immediate - ra"
operands = [
  { name = "d",   type = "reg"   },
  { name = "a",   type = "reg"   },
  { name = "imm", type = "int16" },
]
syntax   = "{d}, {a}, #{imm}"
semantics = "R[d] = imm - R[a]"

  [[insn.form]]
  name     = "reg_imm5"
  encoding = "0100_0000  iiii_iddd"
  fields   = { i = "imm:imm5" }
  tie      = { a = "d" }

  [[insn.form]]
  name     = "reg_reg_imm3"
  encoding = "0100_001i  jjaa_addd"
  fields   = { i = "imm:imm3[0]", j = "imm:imm3[2:1]" }

  [[insn.form]]
  name     = "reg_reg_imm10"
  encoding = "0100_0001  iiaa_addd  jjjj_jjjj"
  fields   = { i = "imm:imm10[1:0]", j = "imm:imm10[9:2]" }


[[insn]]
mnemonic = "xor"
summary  = "rd = ra ^ rb"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{d}, {a}, {b}"
semantics = "R[d] = R[a] ^ R[b]"

  [[insn.form]]
  name     = "three_reg"
  encoding = "0100_111b  ccaa_addd"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }

[[insn]]
mnemonic = "xor"
summary  = "rd = ra ^ immediate"
operands = [
  { name = "d",   type = "reg"   },
  { name = "a",   type = "reg"   },
  { name = "imm", type = "int16" },
]
syntax   = "{d}, {a}, #{imm}"
semantics = "R[d] = R[a] ^ imm"

  # NEGATING A PREDICATE IS ONE BYTE.  iseq and isset return 1 or 0 and never
  # anything else, so `xor rd, rd, #1` is exactly `!` on their result - and r0
  # is where a return value lives, so a bool-returning function that wants `!=`
  # where it computed `==` ends with this and a `ret`, two bytes in total.
  #
  # It costs one of the three free one-byte slots, and pins both operands, which
  # is what an abbreviation is.
  [[insn.form]]
  name     = "r0_not"
  encoding = "1000_0100"
  fix      = { d = 0, a = 0, imm = 1 }

  [[insn.form]]
  name     = "reg_imm5"
  encoding = "0100_1000  iiii_iddd"
  fields   = { i = "imm:imm5" }
  tie      = { a = "d" }

  # BIT FLIP, completing the set.  `or #1<<n` sets a bit and `and #~(1<<n)`
  # clears one; this toggles one, in the same two bytes and through the same
  # 4-to-16 decoder.  It costs an opcode the group had already reserved: slot
  # +4 of every eight is the immbit5 slot, and it was free here only because
  # nothing had asked for it yet.
  #
  # The inverted half of the table is not wasted on xor either.  `xor rd, rd,
  # #~(1<<n)` flips every bit EXCEPT one, which is a complement with a single
  # bit held back.
  #
  # The PLAIN complement is not in this form and does not need to be: 0xffff is
  # not ~(1<<n) for any n, but it is -1, which imm5 reaches - so `xor rd, rd,
  # #-1` is already two bytes at 0x50.  Where the two forms overlap the
  # assembler prefers imm5, which is listed first, and drops the duplicate
  # entries here.
  [[insn.form]]
  name     = "reg_immbit5"
  encoding = "0100_1100  iiii_iddd"
  fields   = { i = "imm:immbit5" }
  tie      = { a = "d" }

  # The same shape again, read through immask5: fields and stripes rather than
  # single bits.  Column .5 of the ALU block was reserved and empty.
  [[insn.form]]
  name     = "reg_immask5"
  encoding = "0100_1101  iiii_iddd"
  fields   = { i = "imm:immask5" }
  tie      = { a = "d" }

  [[insn.form]]
  name     = "reg_reg_imm3"
  encoding = "0100_101i  jjaa_addd"
  fields   = { i = "imm:imm3[0]", j = "imm:imm3[2:1]" }

  [[insn.form]]
  name     = "reg_reg_imm10"
  encoding = "0100_1001  iiaa_addd  jjjj_jjjj"
  fields   = { i = "imm:imm10[1:0]", j = "imm:imm10[9:2]" }


[[insn]]
mnemonic = "or"
summary  = "rd = ra | rb"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{d}, {a}, {b}"
semantics = "R[d] = R[a] | R[b]"

  [[insn.form]]
  name     = "three_reg"
  encoding = "0101_011b  ccaa_addd"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }

[[insn]]
mnemonic = "or"
summary  = "rd = ra | immediate"
operands = [
  { name = "d",   type = "reg"   },
  { name = "a",   type = "reg"   },
  { name = "imm", type = "int16" },
]
syntax   = "{d}, {a}, #{imm}"
semantics = "R[d] = R[a] | imm"

  # One-byte register moves.  `or rd, ra, #0` is a copy, so pinning the two
  # hot registers both ways gives single-byte `mov r0, r1` and `mov r1, r0`
  # without a mov opcode existing at all.  The `mov` alias rewrites to `or`,
  # and shortest-first selection lands on these.
  [[insn.form]]
  name     = "mov_r0_r1"
  encoding = "1000_0001"
  fix      = { d = 0, a = 1, imm = 0 }

  [[insn.form]]
  name     = "mov_r1_r0"
  encoding = "1000_0010"
  fix      = { d = 1, a = 0, imm = 0 }

  [[insn.form]]
  name     = "reg_imm5"
  encoding = "0101_0000  iiii_iddd"
  fields   = { i = "imm:imm5" }
  tie      = { a = "d" }

  # BIT SET.  `or rd, rd, #1<<n` for any n, in two bytes.
  [[insn.form]]
  name     = "reg_immbit5"
  encoding = "0101_0100  iiii_iddd"
  fields   = { i = "imm:immbit5" }
  tie      = { a = "d" }

  # The same shape again, read through immask5: fields and stripes rather than
  # single bits.  Column .5 of the ALU block was reserved and empty.
  [[insn.form]]
  name     = "reg_immask5"
  encoding = "0101_0101  iiii_iddd"
  fields   = { i = "imm:immask5" }
  tie      = { a = "d" }

  [[insn.form]]
  name     = "reg_reg_imm3"
  encoding = "0101_001i  jjaa_addd"
  fields   = { i = "imm:imm3[0]", j = "imm:imm3[2:1]" }

  [[insn.form]]
  name     = "reg_reg_imm10"
  encoding = "0101_0001  iiaa_addd  jjjj_jjjj"
  fields   = { i = "imm:imm10[1:0]", j = "imm:imm10[9:2]" }


[[insn]]
mnemonic = "and"
summary  = "rd = ra & rb"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{d}, {a}, {b}"
semantics = "R[d] = R[a] & R[b]"

  [[insn.form]]
  name     = "three_reg"
  encoding = "0101_111b  ccaa_addd"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }

[[insn]]
mnemonic = "and"
summary  = "rd = ra & immediate"
operands = [
  { name = "d",   type = "reg"   },
  { name = "a",   type = "reg"   },
  { name = "imm", type = "int16" },
]
syntax   = "{d}, {a}, #{imm}"
semantics = "R[d] = R[a] & imm"

  [[insn.form]]
  name     = "reg_imm5"
  encoding = "0101_1000  iiii_iddd"
  fields   = { i = "imm:imm5" }
  tie      = { a = "d" }

  # BIT CLEAR.  `and rd, rd, #~(1<<n)` for any n, in two bytes.  This is the
  # half of immbit5 that would have gone to waste if the fifth bit had stayed a
  # set/clear selector, and it is the more useful half: masking the sign bit
  # off a value is one instruction now instead of a shl/lsr pair.
  [[insn.form]]
  name     = "reg_immbit5"
  encoding = "0101_1100  iiii_iddd"
  fields   = { i = "imm:immbit5" }
  tie      = { a = "d" }

  # The same shape again, read through immask5: fields and stripes rather than
  # single bits.  Column .5 of the ALU block was reserved and empty.
  [[insn.form]]
  name     = "reg_immask5"
  encoding = "0101_1101  iiii_iddd"
  fields   = { i = "imm:immask5" }
  tie      = { a = "d" }

  [[insn.form]]
  name     = "reg_reg_imm3"
  encoding = "0101_101i  jjaa_addd"
  fields   = { i = "imm:imm3[0]", j = "imm:imm3[2:1]" }

  [[insn.form]]
  name     = "reg_reg_imm10"
  encoding = "0101_1001  iiaa_addd  jjjj_jjjj"
  fields   = { i = "imm:imm10[1:0]", j = "imm:imm10[9:2]" }


# --- shl / asr / lsr --------------------------------------------------------
# Three forms each, five opcodes each: a tied register with imm5, three
# registers, and two registers with a table immediate.  No imm10 form - ten
# bits of shift count would be absurd - and no one-byte encodings.
#
# Every shift uses only the low 4 bits of its count, whether that count comes
# from a register or an immediate.  So a shift by 16 is a shift by 0, and a
# shift by -1 is a shift by 15.  The `shift3` table spells that last one as 15
# directly; the imm5 form does NOT translate, so `shl r0, r0, #-1` assembles
# and means 15, which is legal but not a spelling to encourage.  Tightening
# the imm5 form to an unsigned 0..15 would remove the trap at the cost of
# rejecting counts the hardware would have accepted.
[[insn]]
mnemonic = "shl"
summary  = "rd = ra << (rb & 15)"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{d}, {a}, {b}"
semantics = "R[d] = shl(R[a], R[b] & 15)"

  [[insn.form]]
  name     = "three_reg"
  encoding = "0110_011b  ccaa_addd"
  fields   = { b = "b:reg[0]", c = "b:reg[2:1]" }

[[insn]]
mnemonic = "shl"
summary  = "rd = ra << (imm & 15)"
operands = [
  { name = "d",   type = "reg"   },
  { name = "a",   type = "reg"   },
  { name = "imm", type = "int16" },
]
syntax   = "{d}, {a}, #{imm}"
semantics = "R[d] = shl(R[a], imm & 15)"

  [[insn.form]]
  name     = "reg_imm5"
  encoding = "0110_0000  iiii_iddd"
  fields   = { i = "imm:imm5" }
  tie      = { a = "d" }

  [[insn.form]]
  name     = "reg_reg_imm3"
  encoding = "0110_001i  jjaa_addd"
  fields   = { i = "imm:shift3[0]", j = "imm:shift3[2:1]" }


[[insn]]
mnemonic = "asr"
summary  = "rd = ra >> (rb & 15), sign propagating"
operands = [
  { name = "d", type = "reg" },
  { name = "a", type = "reg" },
  { name = "b", type = "reg" },
]
syntax   = "{d}, {a}, {b}"
